<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | Nellai Specialz</title>
    <meta
      name="description"
      content="Checkout your cart securely and place your order from Nellai Specialz."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth/session.js"></script>
    <script src="assets/js/checkout.js"></script>
  </head>
  <body class="overflow-x-hidden bg-[#FBF5E9] text-[#32110D] antialiased selection:bg-[#8C1C13] selection:text-white">
    <div id="site-header"></div>

    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 bg-[#FBF5E9]">
      <div class="mb-8">
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#8C1C13]">Checkout</p>
        <h1 class="mt-2 font-serif text-3xl font-bold text-[#321307] sm:text-4xl">Secure your order</h1>
      </div>

      <div class="grid gap-8 lg:grid-cols-[1.2fr_0.8fr]">
        <section>
          <div class="rounded-2xl border border-[#EADBC1] bg-white p-6 shadow-xl shadow-[#321307]/5 sm:p-8">
            <div class="flex items-center justify-between gap-4">
              <h2 class="font-serif text-2xl font-bold text-[#321307]">Delivery address</h2>
              <span class="rounded-full border border-[#D9B86C] bg-[#FFFBF5] px-3 py-0.5 text-xs font-bold uppercase tracking-[0.2em] text-[#8C1C13]">Step 1 of 2</span>
            </div>
            <div id="addressList" class="mt-6 space-y-3"></div>
            <div id="addressFormContainer"></div>
          </div>
        </section>

        <aside>
          <div class="rounded-2xl border border-[#EADBC1] bg-white p-6 shadow-xl shadow-[#321307]/5 sm:p-8">
            <h2 class="font-serif text-2xl font-bold text-[#321307]">Order summary</h2>
            <p class="mt-2 text-sm text-[#806B58]">Signed in as <span id="customerName" class="font-bold text-[#321307]">Customer</span></p>

            <div id="checkoutCartRows" class="mt-6 space-y-3"></div>

            <div class="mt-6 rounded-xl border border-[#EADBC1] bg-[#FFFBF5] p-4">
              <label for="checkoutCouponCode" class="text-sm font-bold text-[#321307]">Coupon code</label>
              <div class="mt-2 flex gap-2">
                <input id="checkoutCouponCode" type="text" maxlength="80" placeholder="Enter coupon code" class="min-w-0 flex-1 rounded-lg border border-[#EADBC1] bg-white px-3 py-2 text-sm uppercase outline-none focus:border-[#8C1C13]">
                <button id="applyCouponBtn" type="button" class="rounded-lg bg-[#8C1C13] px-4 py-2 text-sm font-bold text-white">Apply</button>
              </div>
              <div id="couponStatus" class="mt-2 text-sm" aria-live="polite"></div>
            </div>

            <div class="mt-6 space-y-3 border-t border-[#EADBC1] pt-4 text-sm text-[#806B58]">
              <div class="flex items-center justify-between">
                <span>Subtotal</span>
                <span id="checkoutSubtotal" class="font-semibold text-[#321307]">₹0</span>
              </div>
              <div class="flex items-center justify-between">
                <span>Delivery</span>
                <span class="font-semibold text-emerald-700">FREE</span>
              </div>
              <div id="checkoutDiscountRow" class="hidden flex items-center justify-between text-emerald-700">
                <span id="checkoutDiscountLabel">Coupon discount</span>
                <span id="checkoutDiscount">-₹0</span>
              </div>
              <div class="flex items-center justify-between border-t border-[#EADBC1] pt-3 text-lg font-bold text-[#321307]">
                <span>Total</span>
                <span id="checkoutTotal" class="text-xl text-[#8C1C13]">₹0</span>
              </div>
            </div>

            <div id="checkoutMessage"></div>

            <button
              id="placeOrderBtn"
              type="button"
              class="mt-6 h-12 w-full rounded-full bg-[#8C1C13] font-bold text-[#FFF8EF] shadow-md shadow-[#8C1C13]/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#7A120A] cursor-pointer"
            >
              Place order
            </button>
            <button
              id="continueShoppingBtn"
              type="button"
              class="mt-3 h-11 w-full rounded-full border border-[#EADBC1] bg-[#FFFBF5] font-bold text-[#8C1C13] transition hover:bg-[#FFF8EF] cursor-pointer"
            >
              Continue shopping
            </button>
          </div>
        </aside>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
