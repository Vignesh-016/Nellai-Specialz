<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | Nellai Specialz</title>
    <meta
      name="description"
      content="Checkout your cart securely and place your order from Nellai Specialz."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth/session.js"></script>
    <script src="assets/js/checkout.js"></script>
  </head>
  <body class="overflow-x-hidden bg-[#fff8eb] text-[#2c160f] antialiased selection:bg-[#b88932] selection:text-white">
    <div id="site-header"></div>

    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <div class="mb-8">
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#b88932]">Checkout</p>
        <h1 class="mt-2 font-serif text-4xl font-semibold text-[#321307]">Secure your order</h1>
      </div>

      <div class="grid gap-8 lg:grid-cols-[1.2fr_0.8fr]">
        <section>
          <div class="rounded-2xl border border-[#E7DDD1] bg-white p-6 shadow-[0_16px_40px_rgba(74,22,15,0.04)] sm:p-8">
            <div class="flex items-center justify-between gap-4">
              <h2 class="font-serif text-2xl font-semibold text-[#321307]">Delivery address</h2>
              <span class="text-xs font-semibold uppercase tracking-[0.2em] text-[#b88932]">1 of 2</span>
            </div>
            <div id="addressList" class="mt-6 space-y-3"></div>
            <div id="addressFormContainer"></div>
          </div>
        </section>

        <aside>
          <div class="rounded-2xl border border-[#E7DDD1] bg-white p-6 shadow-[0_16px_40px_rgba(74,22,15,0.04)] sm:p-8">
            <h2 class="font-serif text-2xl font-semibold text-[#321307]">Order summary</h2>
            <p class="mt-2 text-sm text-[#806b58]">Signed in as <span id="customerName" class="font-semibold text-[#32110D]">Customer</span></p>

            <div id="checkoutCartRows" class="mt-6 space-y-3"></div>

            <div class="mt-6 space-y-3 border-t border-[#E7DDD1] pt-4 text-sm text-[#4f3d35]">
              <div class="flex items-center justify-between">
                <span>Subtotal</span>
                <span id="checkoutSubtotal">₹0</span>
              </div>
              <div class="flex items-center justify-between">
                <span>Delivery</span>
                <span>₹0</span>
              </div>
              <div class="flex items-center justify-between font-bold text-base text-[#32110D]">
                <span>Total</span>
                <span id="checkoutTotal">₹0</span>
              </div>
            </div>

            <div id="checkoutMessage"></div>

            <button
              id="placeOrderBtn"
              type="button"
              class="mt-6 h-12 w-full rounded-lg bg-[#4d190e] font-semibold text-[#fff6df] transition hover:bg-[#702217]"
            >
              Place order
            </button>
            <button
              id="continueShoppingBtn"
              type="button"
              class="mt-3 h-11 w-full rounded-lg border border-[#B88932]/40 bg-[#FBF5E9] font-semibold text-[#4d190e] transition hover:bg-[#F2E7D3]"
            >
              Continue shopping
            </button>
          </div>
        </aside>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
