<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify Email | Nellai Specialz</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script src="assets/js/api.js"></script></head><body class="min-h-screen bg-[#fff8eb] text-[#32110D]"><main class="mx-auto flex min-h-screen max-w-md items-center px-5 py-12"><section class="w-full rounded-3xl border border-[#EADBC1] bg-white p-7 shadow-xl"><p class="text-xs font-bold uppercase tracking-[.2em] text-[#B88932]">Email verification</p><h1 class="mt-3 font-serif text-4xl font-semibold">Verify your account</h1><p class="mt-3 text-sm text-[#74685F]">Enter the 6-digit code sent to your email.</p><form id="customerVerifyForm" class="mt-7 space-y-5"><label class="block text-sm font-semibold">Email<input id="verify-email" type="email" readonly class="mt-2 h-12 w-full rounded-xl border border-[#E7DDD1] bg-[#FBF7F0] px-4"></label><label class="block text-sm font-semibold">Verification code<input id="verify-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required class="mt-2 h-12 w-full rounded-xl border border-[#E7DDD1] px-4 text-center text-xl tracking-[.45em]"></label><p data-verify-error class="text-sm text-red-700"></p><button type="submit" class="h-12 w-full rounded-xl bg-[#4d190e] font-semibold text-white">Verify email</button></form></section></main><script src="assets/js/verify-otp.js"></script></body></html>
