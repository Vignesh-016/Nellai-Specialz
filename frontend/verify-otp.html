<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Email | Nellai Specialz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
  </head>
  <body class="min-h-screen bg-[#FBF5E9] font-sans text-[#32110D] antialiased selection:bg-[#8C1C13] selection:text-white">
    <div id="site-header"></div>
    <main class="mx-auto flex min-h-[calc(100vh-160px)] max-w-md items-center px-5 py-12">
      <section class="w-full rounded-2xl border border-[#EADBC1] bg-white p-7 shadow-xl shadow-[#321307]/5 sm:p-10">
        <a href="index.html" class="inline-block mb-6">
          <img src="assets/images/nellai-specialz-logo.png" alt="Nellai Specialz" class="h-12 w-auto object-contain" />
        </a>
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#8C1C13]">Email verification</p>
        <h1 class="mt-2 font-serif text-3xl font-bold text-[#321307] sm:text-4xl">Verify your account</h1>
        <p class="mt-2 text-sm leading-relaxed text-[#806B58]">Enter the 6-digit verification code sent to your email.</p>
        <form id="customerVerifyForm" class="mt-7 space-y-5">
          <div>
            <label for="verify-email" class="mb-2 block text-sm font-semibold text-[#321307]">Email</label>
            <input
              id="verify-email"
              type="email"
              readonly
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20 opacity-80"
            />
          </div>
          <div>
            <label for="verify-otp" class="mb-2 block text-sm font-semibold text-[#321307]">Verification code</label>
            <input
              id="verify-otp"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              required
              placeholder="000000"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-center text-xl font-bold tracking-[0.45em] text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <p data-verify-error class="text-sm text-red-700"></p>
          <button
            type="submit"
            class="h-12 w-full rounded-full bg-[#8C1C13] font-bold text-[#FFF8EF] shadow-md shadow-[#8C1C13]/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#7A120A] cursor-pointer"
          >
            Verify email
          </button>
        </form>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/verify-otp.js"></script>
  </body>
</html>
