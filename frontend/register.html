<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account | Nellai Specialz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/checkout.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth/session.js"></script>
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-[#FBF5E9] text-[#32110D] antialiased selection:bg-[#8C1C13] selection:text-white"
  >
    <div id="site-header"></div>
    <main
      class="mx-auto flex min-h-screen w-full max-w-[1280px] items-center justify-center px-4 py-10 sm:px-6 lg:px-8 bg-[#FBF5E9]"
    >
      <section
        class="w-full max-w-2xl rounded-2xl border border-[#EADBC1] bg-white p-6 shadow-xl shadow-[#321307]/5 sm:p-10"
      >
        <a href="index.html" class="inline-block"
          ><img
            src="assets/images/nellai-specialz-logo.png"
            alt="Nellai Specialz"
            class="h-12 w-auto object-contain"
        /></a>
        <p
          class="mt-8 text-xs font-bold uppercase tracking-[0.22em] text-[#8C1C13]"
        >
          Join Us
        </p>
        <h1 class="mt-2 font-serif text-3xl font-bold text-[#321307] sm:text-4xl">
          Create your account
        </h1>
        <p class="mt-2 text-sm text-[#806B58]">
          Save your details for a smoother shopping experience.
        </p>
        <form id="customerRegisterForm"
          class="mt-8 grid gap-5 sm:grid-cols-2"
          
        >
          <div>
            <label for="first-name" class="mb-2 block text-sm font-semibold text-[#321307]"
              >First name</label
            ><input
              id="first-name"
              required
              placeholder="First name"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <div>
            <label for="last-name" class="mb-2 block text-sm font-semibold text-[#321307]"
              >Last name</label
            ><input
              id="last-name"
              required
              placeholder="Last name"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <div>
            <label for="register-email" class="mb-2 block text-sm font-semibold text-[#321307]"
              >Email</label
            ><input
              id="register-email"
              type="email"
              required
              placeholder="your@email.com"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <div>
            <label for="phone" class="mb-2 block text-sm font-semibold text-[#321307]"
              >Phone</label
            ><input
              id="phone"
              type="tel"
              required
              placeholder="Mobile number"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <div>
            <label
              for="register-password"
              class="mb-2 block text-sm font-semibold text-[#321307]"
              >Password</label
            ><input
              id="register-password"
              data-password-main
              type="password"
              required
              placeholder="Create password"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <div>
            <label
              for="confirm-password"
              class="mb-2 block text-sm font-semibold text-[#321307]"
              >Confirm password</label
            ><input
              id="confirm-password"
              data-password-confirm
              type="password"
              required
              placeholder="Confirm password"
              class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
            />
          </div>
          <label
            class="flex items-center gap-3 text-sm text-[#806B58] sm:col-span-2 cursor-pointer"
            ><input type="checkbox" required class="h-4 w-4 rounded border-[#EADBC1] accent-[#8C1C13]" />
            I agree to the Terms and Privacy Policy.</label
          >
          <button
            type="submit"
            class="h-12 rounded-full bg-[#8C1C13] font-bold text-[#FFF8EF] shadow-md shadow-[#8C1C13]/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#7A120A] sm:col-span-2 cursor-pointer"
          >
            Create account
          </button>
        </form>
        <p class="mt-6 text-center text-sm text-[#806B58]">
          Already have an account?
          <a
            href="login.html"
            class="font-semibold text-[#8C1C13] underline decoration-[#D9B86C] underline-offset-4 transition hover:text-[#7A120A]"
            >Sign in</a
          >
        </p>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/register.js"></script>
  </body>
</html>
