<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="products" data-admin-title="Products" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6" id="products-section">
      <!-- Header -->
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Manage your catalogue and inventory.</p>
        <button onclick="openProductModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Add product</button>
      </div>

      <!-- Filters -->
      <div class="rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center">
          <input id="product-search" oninput="filterProducts()" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] transition" placeholder="Search products..." />
          <select id="product-category-filter" onchange="filterProducts()" class="rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
            <option value="">All categories</option>
            <option>Halwa</option>
            <option>Combos</option>
            <option>Savouries</option>
          </select>
          <select id="product-status-filter" onchange="filterProducts()" class="rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
            <option value="">All status</option>
            <option>Active</option>
            <option>Draft</option>
            <option>Out of stock</option>
          </select>
        </div>

        <!-- Products Table -->
        <div class="overflow-x-auto">
          <table class="w-full min-w-[800px] text-left text-sm">
            <thead class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]">
              <tr>
                <th class="p-3">Product</th>
                <th class="p-3">Category</th>
                <th class="p-3">Price</th>
                <th class="p-3">Stock</th>
                <th class="p-3">Status</th>
                <th class="p-3">Flags</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody" class="divide-y divide-[#f0e5d8]"></tbody>
          </table>
        </div>
        <div id="products-empty" class="hidden py-12 text-center text-sm text-[#7e5a43]">No products match your filters.</div>
      </div>
    </section>

    <!-- ═══════════════ ADD/EDIT PRODUCT MODAL ═══════════════ -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="product-modal-title" class="text-xl font-bold text-[#32110d]">Add product</h2>
          <button onclick="AdminModal.close('product-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form id="product-form" onsubmit="saveProduct(event)" class="p-6 space-y-6">
          <input type="hidden" id="pf-id" />

          <!-- Basic Info -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Basic information</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="sm:col-span-2">
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Product name <span class="text-red-500">*</span></label>
                <input id="pf-name" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Tirunelveli Karupatti Halwa" />
                <p id="pf-name-error" class="mt-1 text-xs text-red-600 hidden">Product name is required.</p>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Category <span class="text-red-500">*</span></label>
                <select id="pf-category" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="">Select category</option>
                  <option>Halwa</option>
                  <option>Combos</option>
                  <option>Savouries</option>
                </select>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Sub Category</label>
                <select id="pf-subcategory" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="">Select sub category</option>
                  <option>Traditional</option>
                  <option>Premium</option>
                  <option>Gift Box</option>
                </select>
              </div>
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Description</label>
              <textarea id="pf-description" rows="3" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Describe the product..."></textarea>
            </div>
          </div>

          <!-- Pricing & Variations -->
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Pricing & Variations</h3>
              <button type="button" onclick="addVariation()" class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">+ Add variation</button>
            </div>
            <div id="variations-container" class="space-y-3">
              <!-- Default variation row -->
              <div class="variation-row flex flex-col sm:flex-row gap-3 items-start sm:items-end rounded-xl border border-[#eadbc6] bg-[#fffcf7] p-4">
                <div class="flex-1">
                  <label class="mb-1 block text-xs font-semibold text-[#594b45]">Weight / Size</label>
                  <input class="var-weight w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. 250g, 500g, 1kg" />
                </div>
                <div class="w-full sm:w-36">
                  <label class="mb-1 block text-xs font-semibold text-[#594b45]">Price (₹) <span class="text-red-500">*</span></label>
                  <input type="number" class="var-price w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" min="0" />
                </div>
                <div class="w-full sm:w-28">
                  <label class="mb-1 block text-xs font-semibold text-[#594b45]">Stock</label>
                  <input type="number" class="var-stock w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" min="0" />
                </div>
                <button type="button" onclick="removeVariation(this)" class="hidden mt-1 grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition">✕</button>
              </div>
            </div>
          </div>

          <!-- Image Upload UI -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Images</h3>
            <div id="image-upload-area" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div id="image-add-btn" onclick="simulateImageUpload()" class="group cursor-pointer flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-[#d5c5b0] bg-[#fffcf7] p-6 hover:border-[#9b6b2c] hover:bg-[#faf5ed] transition min-h-[120px]">
                <span class="text-2xl text-[#9b6b2c] group-hover:scale-110 transition-transform">📷</span>
                <span class="text-xs font-semibold text-[#7e5a43]">Add image</span>
              </div>
            </div>
            <p class="text-xs text-[#a89387]">Click to upload. First image is the primary thumbnail. Drag to reorder.</p>
          </div>

          <!-- Flags -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Flags & Status</h3>
            <div class="flex flex-wrap gap-4">
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input type="checkbox" id="pf-featured" class="h-4 w-4 rounded border-[#d5c5b0] text-[#8e281d] accent-[#8e281d]" />
                <span class="text-sm font-semibold text-[#594b45]">Featured product</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input type="checkbox" id="pf-bestseller" class="h-4 w-4 rounded border-[#d5c5b0] text-[#8e281d] accent-[#8e281d]" />
                <span class="text-sm font-semibold text-[#594b45]">Bestseller</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input type="checkbox" id="pf-active" checked class="h-4 w-4 rounded border-[#d5c5b0] text-[#8e281d] accent-[#8e281d]" />
                <span class="text-sm font-semibold text-[#594b45]">Active (visible in store)</span>
              </label>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('product-modal')" class="rounded-xl border border-[#e8e1da] px-5 py-3 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" class="rounded-xl bg-[#54170f] px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">Save product</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ═══════════════ VIEW PRODUCT MODAL ═══════════════ -->
    <div id="product-view-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 class="text-xl font-bold text-[#32110d]">Product details</h2>
          <button onclick="AdminModal.close('product-view-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <div id="product-view-body" class="p-6 space-y-5"></div>
      </div>
    </div>

    <!-- ═══════════════ INVENTORY ADJUSTMENT MODAL ═══════════════ -->
    <div id="inventory-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-md rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="flex items-center justify-between border-b border-[#eee8e2] px-6 py-4">
          <h2 class="text-xl font-bold text-[#32110d]">Adjust stock</h2>
          <button onclick="AdminModal.close('inventory-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form onsubmit="saveInventory(event)" class="p-6 space-y-5">
          <input type="hidden" id="inv-product-id" />
          <div>
            <p class="text-sm font-semibold text-[#32110d]" id="inv-product-name"></p>
            <p class="text-xs text-[#7e5a43] mt-1" id="inv-current-stock"></p>
          </div>
          <div id="inv-variations-list" class="space-y-3"></div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Reason for adjustment</label>
            <select id="inv-reason" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
              <option>Restock / New shipment</option>
              <option>Manual correction</option>
              <option>Damaged / Expired</option>
              <option>Returned stock</option>
            </select>
          </div>
          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('inventory-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Update stock</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script>
    /* ═══════════════ SAMPLE PRODUCT DATA ═══════════════ */
    let products = [
      {
        id: 1, name: "Tirunelveli Karupatti Halwa", category: "Halwa", subcategory: "Traditional",
        description: "Authentic palm jaggery halwa handmade with pure ghee and wheat, following the centuries-old Tirunelveli tradition.",
        variations: [
          { weight: "250g", price: 250, stock: 20 },
          { weight: "500g", price: 450, stock: 15 },
          { weight: "1kg", price: 850, stock: 7 },
        ],
        featured: true, bestseller: true, active: true,
        images: ["karupatti-1.jpg", "karupatti-2.jpg"],
      },
      {
        id: 2, name: "Ghee Halwa", category: "Halwa", subcategory: "Traditional",
        description: "Rich and silky ghee-based wheat halwa, golden brown and aromatic.",
        variations: [
          { weight: "250g", price: 180, stock: 30 },
          { weight: "500g", price: 320, stock: 22 },
          { weight: "1kg", price: 600, stock: 10 },
        ],
        featured: false, bestseller: true, active: true,
        images: ["ghee-halwa.jpg"],
      },
      {
        id: 3, name: "Muscoth Halwa", category: "Halwa", subcategory: "Premium",
        description: "Delicate, melt-in-mouth muscoth halwa made with premium cornflour and cashews.",
        variations: [
          { weight: "250g", price: 160, stock: 25 },
          { weight: "500g", price: 280, stock: 18 },
          { weight: "1kg", price: 500, stock: 12 },
        ],
        featured: false, bestseller: false, active: true,
        images: ["muscoth.jpg"],
      },
      {
        id: 4, name: "Traditional Halwa Combo", category: "Combos", subcategory: "Gift Box",
        description: "A curated box featuring three heritage halwa varieties for gifting.",
        variations: [{ weight: "Combo Box", price: 1500, stock: 0 }],
        featured: true, bestseller: false, active: true,
        images: ["combo.jpg"],
      },
      {
        id: 5, name: "Cashew Halwa", category: "Halwa", subcategory: "Premium",
        description: "Premium halwa loaded with roasted cashews and flavoured with cardamom.",
        variations: [
          { weight: "250g", price: 220, stock: 18 },
          { weight: "500g", price: 400, stock: 0 },
          { weight: "1kg", price: 750, stock: 5 },
        ],
        featured: false, bestseller: false, active: true,
        images: [],
      },
      {
        id: 6, name: "Wheat Halwa", category: "Halwa", subcategory: "Traditional",
        description: "Classic wheat-based halwa with a smooth, creamy texture.",
        variations: [{ weight: "500g", price: 280, stock: 35 }],
        featured: false, bestseller: false, active: false,
        images: [],
      },
    ];
    let nextId = 7;

    /* ═══════════════ RENDER TABLE ═══════════════ */
    function renderProducts() {
      const tbody = document.getElementById("products-tbody");
      const empty = document.getElementById("products-empty");
      const filtered = getFilteredProducts();

      if (!filtered.length) {
        tbody.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      tbody.innerHTML = filtered
        .map((p) => {
          const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
          const priceRange = p.variations.length > 1
            ? `₹${Math.min(...p.variations.map(v => v.price))} – ₹${Math.max(...p.variations.map(v => v.price))}`
            : `₹${p.variations[0].price}`;
          const statusLabel = !p.active ? "Draft" : totalStock === 0 ? "Out of stock" : "Active";
          const statusColor = !p.active
            ? "bg-gray-100 text-gray-600"
            : totalStock === 0
            ? "bg-red-50 text-red-700"
            : "bg-emerald-50 text-emerald-700";
          const flags = [];
          if (p.featured) flags.push('<span class="rounded-full bg-purple-50 px-2 py-0.5 text-[10px] font-bold text-purple-700">Featured</span>');
          if (p.bestseller) flags.push('<span class="rounded-full bg-amber-50 px-2 py-0.5 text-[10px] font-bold text-amber-700">Bestseller</span>');

          return `<tr class="group hover:bg-[#fffcf7] transition">
            <td class="p-3">
              <div class="flex items-center gap-3">
                <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-[#f3e7d5] text-lg text-[#9b6b2c]">${p.images.length ? "🖼" : "□"}</div>
                <div>
                  <p class="font-semibold text-[#32110d]">${p.name}</p>
                  <p class="text-xs text-[#a89387]">${p.variations.length} variant${p.variations.length > 1 ? "s" : ""}</p>
                </div>
              </div>
            </td>
            <td class="p-3 text-[#594b45]">${p.category}</td>
            <td class="p-3 font-semibold">${priceRange}</td>
            <td class="p-3">
              <span class="${totalStock <= 5 && totalStock > 0 ? "text-amber-600 font-semibold" : totalStock === 0 ? "text-red-600 font-semibold" : ""}">${totalStock}</span>
            </td>
            <td class="p-3"><span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold">${statusLabel}</span></td>
            <td class="p-3"><div class="flex flex-wrap gap-1">${flags.join("") || '<span class="text-xs text-[#c4b5a5]">—</span>'}</div></td>
            <td class="p-3">
              <div class="flex justify-end gap-2">
                <button onclick="viewProduct(${p.id})" title="View" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#594b45] hover:bg-[#f5eee8] transition">👁</button>
                <button onclick="editProduct(${p.id})" title="Edit" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition">✎</button>
                <button onclick="openInventory(${p.id})" title="Stock" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#9b6b2c] hover:bg-[#f5eee8] transition">▤</button>
                <button onclick="deleteProduct(${p.id})" title="Delete" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition">🗑</button>
              </div>
            </td>
          </tr>`;
        })
        .join("");
    }

    function getFilteredProducts() {
      const search = (document.getElementById("product-search")?.value || "").toLowerCase();
      const cat = document.getElementById("product-category-filter")?.value || "";
      const status = document.getElementById("product-status-filter")?.value || "";

      return products.filter((p) => {
        if (search && !p.name.toLowerCase().includes(search)) return false;
        if (cat && p.category !== cat) return false;
        if (status) {
          const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
          const s = !p.active ? "Draft" : totalStock === 0 ? "Out of stock" : "Active";
          if (s !== status) return false;
        }
        return true;
      });
    }

    function filterProducts() { renderProducts(); }

    /* ═══════════════ ADD / EDIT ═══════════════ */
    function openProductModal(product) {
      document.getElementById("product-modal-title").textContent = product ? "Edit product" : "Add product";
      document.getElementById("pf-id").value = product ? product.id : "";
      document.getElementById("pf-name").value = product ? product.name : "";
      document.getElementById("pf-category").value = product ? product.category : "";
      document.getElementById("pf-subcategory").value = product ? product.subcategory || "" : "";
      document.getElementById("pf-description").value = product ? product.description : "";
      document.getElementById("pf-featured").checked = product ? product.featured : false;
      document.getElementById("pf-bestseller").checked = product ? product.bestseller : false;
      document.getElementById("pf-active").checked = product ? product.active : true;
      document.getElementById("pf-name-error").classList.add("hidden");

      // Build variations
      const container = document.getElementById("variations-container");
      container.innerHTML = "";
      const vars = product ? product.variations : [{ weight: "", price: "", stock: "" }];
      vars.forEach((v) => addVariationRow(v));

      // Reset image area
      resetImageArea(product ? product.images : []);

      AdminModal.open("product-modal");
    }

    function addVariationRow(v = {}) {
      const container = document.getElementById("variations-container");
      const rows = container.querySelectorAll(".variation-row");
      const div = document.createElement("div");
      div.className = "variation-row flex flex-col sm:flex-row gap-3 items-start sm:items-end rounded-xl border border-[#eadbc6] bg-[#fffcf7] p-4";
      div.innerHTML = `
        <div class="flex-1">
          <label class="mb-1 block text-xs font-semibold text-[#594b45]">Weight / Size</label>
          <input class="var-weight w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.weight || ""}" placeholder="e.g. 250g, 500g, 1kg" />
        </div>
        <div class="w-full sm:w-36">
          <label class="mb-1 block text-xs font-semibold text-[#594b45]">Price (₹) <span class="text-red-500">*</span></label>
          <input type="number" class="var-price w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.price || ""}" placeholder="0" min="0" />
        </div>
        <div class="w-full sm:w-28">
          <label class="mb-1 block text-xs font-semibold text-[#594b45]">Stock</label>
          <input type="number" class="var-stock w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.stock ?? ""}" placeholder="0" min="0" />
        </div>
        <button type="button" onclick="removeVariation(this)" class="${rows.length === 0 && !v.weight ? "hidden" : ""} mt-1 grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition">✕</button>`;
      container.appendChild(div);
      updateRemoveButtons();
    }

    function addVariation() { addVariationRow(); }

    function removeVariation(btn) {
      const container = document.getElementById("variations-container");
      if (container.querySelectorAll(".variation-row").length <= 1) return;
      btn.closest(".variation-row").remove();
      updateRemoveButtons();
    }

    function updateRemoveButtons() {
      const rows = document.querySelectorAll("#variations-container .variation-row");
      rows.forEach((row) => {
        const btn = row.querySelector("button");
        if (rows.length <= 1) btn.classList.add("hidden");
        else btn.classList.remove("hidden");
      });
    }

    function resetImageArea(images = []) {
      const area = document.getElementById("image-upload-area");
      area.innerHTML = "";
      images.forEach((img, i) => {
        const div = document.createElement("div");
        div.className = "relative rounded-xl border border-[#eadbc6] bg-[#f3e7d5] p-4 flex items-center justify-center min-h-[120px]";
        div.innerHTML = `
          <span class="text-3xl">🖼</span>
          <span class="absolute top-1 left-2 text-[10px] font-bold text-[#9b6b2c]">${i === 0 ? "Primary" : "#" + (i + 1)}</span>
          <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-[10px] text-white shadow hover:bg-red-600">✕</button>`;
        area.appendChild(div);
      });
      const addBtn = document.createElement("div");
      addBtn.id = "image-add-btn";
      addBtn.onclick = simulateImageUpload;
      addBtn.className = "group cursor-pointer flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-[#d5c5b0] bg-[#fffcf7] p-6 hover:border-[#9b6b2c] hover:bg-[#faf5ed] transition min-h-[120px]";
      addBtn.innerHTML = '<span class="text-2xl text-[#9b6b2c] group-hover:scale-110 transition-transform">📷</span><span class="text-xs font-semibold text-[#7e5a43]">Add image</span>';
      area.appendChild(addBtn);
    }

    function simulateImageUpload() {
      const area = document.getElementById("image-upload-area");
      const addBtn = document.getElementById("image-add-btn");
      const count = area.querySelectorAll(".relative").length;
      const div = document.createElement("div");
      div.className = "relative rounded-xl border border-[#eadbc6] bg-[#f3e7d5] p-4 flex items-center justify-center min-h-[120px] animate-pulse";
      div.innerHTML = `
        <span class="text-3xl">🖼</span>
        <span class="absolute top-1 left-2 text-[10px] font-bold text-[#9b6b2c]">${count === 0 ? "Primary" : "#" + (count + 1)}</span>
        <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-[10px] text-white shadow hover:bg-red-600">✕</button>`;
      area.insertBefore(div, addBtn);
      setTimeout(() => div.classList.remove("animate-pulse"), 800);
      AdminToast.show("Image added (demo)", "info");
    }

    function saveProduct(e) {
      e.preventDefault();
      const name = document.getElementById("pf-name").value.trim();
      if (!name) {
        document.getElementById("pf-name-error").classList.remove("hidden");
        return;
      }
      document.getElementById("pf-name-error").classList.add("hidden");

      const variations = [];
      document.querySelectorAll("#variations-container .variation-row").forEach((row) => {
        variations.push({
          weight: row.querySelector(".var-weight").value || "Default",
          price: parseInt(row.querySelector(".var-price").value) || 0,
          stock: parseInt(row.querySelector(".var-stock").value) || 0,
        });
      });

      const id = document.getElementById("pf-id").value;
      const data = {
        name,
        category: document.getElementById("pf-category").value,
        subcategory: document.getElementById("pf-subcategory").value,
        description: document.getElementById("pf-description").value,
        variations,
        featured: document.getElementById("pf-featured").checked,
        bestseller: document.getElementById("pf-bestseller").checked,
        active: document.getElementById("pf-active").checked,
        images: [],
      };

      // Count images in upload area
      const imgCount = document.querySelectorAll("#image-upload-area .relative").length;
      for (let i = 0; i < imgCount; i++) data.images.push(`image-${i + 1}.jpg`);

      if (id) {
        const idx = products.findIndex((p) => p.id === parseInt(id));
        if (idx > -1) { products[idx] = { ...products[idx], ...data }; }
        AdminToast.show("Product updated successfully");
      } else {
        data.id = nextId++;
        products.push(data);
        AdminToast.show("Product added successfully");
      }

      AdminModal.close("product-modal");
      renderProducts();
    }

    function editProduct(id) {
      const p = products.find((x) => x.id === id);
      if (p) openProductModal(p);
    }

    /* ═══════════════ VIEW PRODUCT ═══════════════ */
    function viewProduct(id) {
      const p = products.find((x) => x.id === id);
      if (!p) return;
      const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
      const flags = [];
      if (p.featured) flags.push("Featured");
      if (p.bestseller) flags.push("Bestseller");

      document.getElementById("product-view-body").innerHTML = `
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-2xl font-bold text-[#32110d]">${p.name}</h3>
          ${!p.active ? '<span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-600">Draft</span>' : ""}
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
            <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Details</p>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between"><span class="text-[#7e5a43]">Category</span><span class="font-semibold">${p.category}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Sub Category</span><span class="font-semibold">${p.subcategory || "—"}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Total stock</span><span class="font-semibold ${totalStock === 0 ? "text-red-600" : ""}">${totalStock}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Flags</span><span class="font-semibold">${flags.join(", ") || "None"}</span></div>
            </div>
          </div>
          <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
            <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Images</p>
            <div class="flex gap-2 flex-wrap">
              ${p.images.length ? p.images.map(() => '<div class="grid h-16 w-16 place-items-center rounded-lg bg-[#f3e7d5] text-xl text-[#9b6b2c]">🖼</div>').join("") : '<p class="text-xs text-[#a89387]">No images uploaded</p>'}
            </div>
          </div>
        </div>
        ${p.description ? `<div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4"><p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Description</p><p class="text-sm text-[#594b45] leading-relaxed">${p.description}</p></div>` : ""}
        <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
          <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-3">Variations & Pricing</p>
          <table class="w-full text-sm">
            <thead class="text-xs text-[#9b6b2c] uppercase"><tr><th class="pb-2 text-left">Weight</th><th class="pb-2 text-left">Price</th><th class="pb-2 text-left">Stock</th></tr></thead>
            <tbody class="divide-y divide-[#eadbc6]">
              ${p.variations.map((v) => `<tr><td class="py-2 font-semibold">${v.weight}</td><td class="py-2">₹${v.price}</td><td class="py-2 ${v.stock === 0 ? "text-red-600 font-semibold" : ""}">${v.stock}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-4">
          <button onclick="AdminModal.close('product-view-modal');editProduct(${p.id})" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Edit product</button>
        </div>`;
      AdminModal.open("product-view-modal");
    }

    /* ═══════════════ DELETE ═══════════════ */
    function deleteProduct(id) {
      const p = products.find((x) => x.id === id);
      if (!p) return;
      AdminConfirm.show(`Are you sure you want to delete "${p.name}"? This cannot be undone.`, () => {
        products = products.filter((x) => x.id !== id);
        renderProducts();
        AdminToast.show("Product deleted", "error");
      });
    }

    /* ═══════════════ INVENTORY ADJUSTMENT ═══════════════ */
    function openInventory(id) {
      const p = products.find((x) => x.id === id);
      if (!p) return;
      document.getElementById("inv-product-id").value = p.id;
      document.getElementById("inv-product-name").textContent = p.name;
      const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
      document.getElementById("inv-current-stock").textContent = `Current total stock: ${totalStock} units`;
      const list = document.getElementById("inv-variations-list");
      list.innerHTML = p.variations
        .map((v, i) => `
          <div class="flex items-center gap-3 rounded-xl border border-[#eadbc6] bg-[#fffcf7] p-3">
            <div class="flex-1">
              <p class="text-sm font-semibold text-[#32110d]">${v.weight}</p>
              <p class="text-xs text-[#7e5a43]">Current: ${v.stock} units</p>
            </div>
            <div class="w-28">
              <label class="mb-1 block text-[10px] font-bold text-[#9b6b2c]">New stock</label>
              <input type="number" class="inv-new-stock w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2 text-sm outline-none focus:border-[#9b6b2c]" value="${v.stock}" min="0" data-index="${i}" />
            </div>
          </div>`)
        .join("");
      AdminModal.open("inventory-modal");
    }

    function saveInventory(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById("inv-product-id").value);
      const p = products.find((x) => x.id === id);
      if (!p) return;
      document.querySelectorAll(".inv-new-stock").forEach((input) => {
        const idx = parseInt(input.dataset.index);
        p.variations[idx].stock = parseInt(input.value) || 0;
      });
      AdminModal.close("inventory-modal");
      renderProducts();
      AdminToast.show("Stock updated successfully");
    }

    /* ═══════════════ INIT ═══════════════ */
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderProducts, 100);
    });
  </script>
</body>
</html>
