<!doctype html>
<html lang="en">
  <head><script src="assets/admin-auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="products" data-admin-title="Products" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6" id="products-section">
      <!-- Header -->
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Manage your catalogue and inventory.</p>
        <button id="addProductBtn" type="button" onclick="openProductModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Add product</button>
      </div>

      <!-- Filters -->
      <div class="rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center">
          <input id="product-search" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] transition" placeholder="Search products..." />
          <select id="product-category-filter" class="rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
            <option value="">All categories</option>
            <option>Halwa</option>
            <option>Combos</option>
            <option>Savouries</option>
          </select>
          <select id="product-status-filter" class="rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
            <option value="">All status</option>
            <option>Active</option>
            <option>Draft</option>
            <option>Inactive</option>
          </select>
        </div>

        <div id="products-api-status" class="hidden mb-4 rounded-xl"></div>

        <!-- Products Table -->
        <div class="overflow-x-auto">
          <table class="w-full min-w-[900px] text-left text-sm">
            <thead class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]">
              <tr>
                <th class="p-3">Product</th>
                <th class="p-3">Category</th>
                <th class="p-3">Sub Category</th>
                <th class="p-3">Price</th>
                <th class="p-3">Stock</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody" class="divide-y divide-[#f0e5d8]"></tbody>
          </table>
        </div>
        <div id="products-empty" class="hidden py-12 text-center text-sm text-[#7e5a43]">No products match your filters.</div>
      </div>
    </section>

    <!-- ═══════════════ ADD/EDIT PRODUCT MODAL ═══════════════ -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="product-modal-title" class="text-xl font-bold text-[#32110d]">Add product</h2>
          <button onclick="AdminModal.close('product-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form id="product-form" class="p-6 space-y-6">
          <input type="hidden" id="pf-id" />

          <!-- 1. Basic Information -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Basic information</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="sm:col-span-2">
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Product name <span class="text-red-500">*</span></label>
                <input id="pf-name" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Tirunelveli Karupatti Halwa" />
                <p id="pf-name-error" class="mt-1 text-xs text-red-600 hidden">Product name is required.</p>
              </div>
              <div class="sm:col-span-2">
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Slug <span class="text-red-500">*</span></label>
                <input id="pf-slug" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm font-mono outline-none focus:border-[#9b6b2c]" placeholder="auto-generated-slug" />
                <p id="pf-slug-error" class="mt-1 text-xs text-red-600 hidden">Slug is required.</p>
              </div>
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Short Description</label>
              <textarea id="pf-short-desc" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Brief summary of the product..."></textarea>
            </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Product Description</label>
            <textarea id="pf-description" rows="4" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Detailed product description..."></textarea>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Key Ingredients</label>
            <textarea id="pf-key-ingredients" rows="3" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Add one ingredient per line"></textarea>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Storage &amp; Shelf Life</label>
            <textarea id="pf-storage-shelf-life" rows="3" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Add one instruction per line"></textarea>
          </div>
          </div>

          <!-- 2. Category -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Category</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Category <span class="text-red-500">*</span></label>
                <select id="pf-category" required onchange="updateSubCategoryOptions()" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="">Select category</option>
                  <option>Halwa</option>
                  <option>Combos</option>
                  <option>Savouries</option>
                </select>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Sub Category</label>
                <select id="pf-subcategory" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="">Select sub category</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Price Variations -->
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Price Variations</h3>
              <button type="button" id="addVariationBtn" class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">+ Add variation</button>
            </div>
            <div id="variations-container" class="space-y-3"></div>
          </div>

          <!-- 4. Inventory Management -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Inventory Management</h3>
            <label class="flex items-center gap-3 cursor-pointer">
              <div class="relative">
                <input type="checkbox" id="pf-manage-inventory" class="sr-only peer" />
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8e281d]"></div>
              </div>
              <span class="text-sm font-semibold text-[#594b45]">Manage Inventory</span>
            </label>
            <div id="inventory-fields" class="hidden space-y-4">
              <div id="inventory-simple" class="grid gap-4 sm:grid-cols-3">
                <div>
                  <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Stock Quantity</label>
                  <input id="pf-stock-qty" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" />
                </div>
                <div>
                  <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Low Stock Threshold</label>
                  <input id="pf-low-threshold" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="5" value="5" />
                </div>
                <div>
                  <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Stock Status</label>
                  <select id="pf-stock-status" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                    <option value="IN_STOCK">In Stock</option>
                    <option value="LOW_STOCK">Low Stock</option>
                    <option value="OUT_OF_STOCK">Out of Stock</option>
                  </select>
                </div>
              </div>
              <div id="inventory-variation-note" class="hidden rounded-xl border border-blue-200 bg-blue-50 p-4">
                <p class="text-xs font-semibold text-blue-700">ℹ Stock is managed per variation above. Product stock totals are derived from the variation quantities.</p>
              </div>
            </div>
          </div>

          <!-- 5. Product Status -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Product Status</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Status</label>
                <select id="pf-status" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="active">Active</option>
                  <option value="draft">Draft</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              <div class="flex items-end pb-1">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" id="pf-featured" class="h-4 w-4 rounded border-[#d5c5b0] text-[#8e281d] accent-[#8e281d]" />
                  <span class="text-sm font-semibold text-[#594b45]">Featured product</span>
                </label>
              </div>
            </div>
          </div>

          <!-- 6. Product Images -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Main Product Image</h3>
            <div id="main-image-area">
              <div id="main-image-preview" class="hidden relative w-40 h-40 rounded-xl border border-[#eadbc6] bg-[#f3e7d5] overflow-hidden mb-3">
                <img id="main-image-img" class="h-full w-full object-cover" />
                <button type="button" id="remove-main-image" class="absolute -top-2 -right-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-[10px] text-white shadow hover:bg-red-600">✕</button>
              </div>
              <input type="file" id="main-image-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" class="hidden" />
              <button type="button" id="main-image-button" class="rounded-lg bg-[#f3e7d5] px-4 py-2.5 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">Upload main image</button>
            </div>
          </div>

          <!-- 7. Gallery Images -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Gallery Images</h3>
            <div id="gallery-area" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
            <input type="file" id="gallery-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple class="hidden" />
            <button type="button" id="gallery-button" class="rounded-lg bg-[#f3e7d5] px-4 py-2.5 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">+ Add gallery images</button>
            <p class="text-xs text-[#a89387]">Upload JPG, PNG, or WebP images (5 MB maximum each).</p>
          </div>

          <!-- Actions -->
          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('product-modal')" class="rounded-xl border border-[#e8e1da] px-5 py-3 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" id="pf-submit-btn" class="rounded-xl bg-[#54170f] px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">Save product</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ═══════════════ VIEW PRODUCT MODAL ═══════════════ -->
    <div id="product-view-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 class="text-xl font-bold text-[#32110d]">Product details</h2>
          <button onclick="AdminModal.close('product-view-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <div id="product-view-body" class="p-6 space-y-5"></div>
      </div>
    </div>
  </template>

    /* ═══════════════ RENDER TABLE ═══════════════ */
    function renderProducts() {
      const tbody = document.getElementById("products-tbody");
      const empty = document.getElementById("products-empty");
      const filtered = getFilteredProducts();

      if (!filtered.length) {
        tbody.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      tbody.innerHTML = filtered
        .map((p) => {
          const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
          const priceRange = p.variations.length > 1
            ? `₹${Math.min(...p.variations.map(v => v.price))} – ₹${Math.max(...p.variations.map(v => v.price))}`
            : `₹${p.variations[0].price}`;
          const statusLabel = p.status === "active" ? "Active" : p.status === "draft" ? "Draft" : "Inactive";
          const statusColor = p.status === "active"
            ? "bg-emerald-50 text-emerald-700"
            : p.status === "draft"
            ? "bg-amber-50 text-amber-700"
            : "bg-gray-100 text-gray-600";

          return `<tr class="group hover:bg-[#fffcf7] transition">
            <td class="p-3">
              <div class="flex items-center gap-3">
                <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-[#f3e7d5] text-lg text-[#9b6b2c] overflow-hidden">${p.mainImage ? `<img src="${p.mainImage}" class="h-full w-full object-cover"/>` : "□"}</div>
                <div>
                  <p class="font-semibold text-[#32110d]">${p.name}</p>
                  <p class="text-xs text-[#a89387]">${p.variations.length} variant${p.variations.length > 1 ? "s" : ""}${p.featured ? ' · <span class="text-purple-600">Featured</span>' : ""}</p>
                </div>
              </div>
            </td>
            <td class="p-3 text-[#594b45]">${p.category}</td>
            <td class="p-3 text-[#7e5a43]">${p.subcategory || "—"}</td>
            <td class="p-3 font-semibold">${priceRange}</td>
            <td class="p-3">
              <span class="${totalStock <= 5 && totalStock > 0 ? "text-amber-600 font-semibold" : totalStock === 0 ? "text-red-600 font-semibold" : ""}">${totalStock}</span>
            </td>
            <td class="p-3"><span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold">${statusLabel}</span></td>
            <td class="p-3">
              <div class="flex justify-end gap-2">
                <button onclick="viewProduct(${p.id})" title="View" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#594b45] hover:bg-[#f5eee8] transition">👁</button>
                <button onclick="editProduct(${p.id})" title="Edit" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition">✎</button>
                <button onclick="deleteProduct(${p.id})" title="Delete" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition">🗑</button>
              </div>
            </td>
          </tr>`;
        })
        .join("");
    }

    function getFilteredProducts() {
      const search = (document.getElementById("product-search")?.value || "").toLowerCase();
      const cat = document.getElementById("product-category-filter")?.value || "";
      const status = document.getElementById("product-status-filter")?.value || "";

      return products.filter((p) => {
        if (search && !p.name.toLowerCase().includes(search)) return false;
        if (cat && p.category !== cat) return false;
        if (status) {
          const s = p.status === "active" ? "Active" : p.status === "draft" ? "Draft" : "Inactive";
          if (s !== status) return false;
        }
        return true;
      });
    }

    function filterProducts() { renderProducts(); }

    /* ═══════════════ SUB CATEGORY FILTER ═══════════════ */
    function updateSubCategoryOptions() {
      const cat = document.getElementById("pf-category").value;
      const subSel = document.getElementById("pf-subcategory");
      subSel.innerHTML = '<option value="">Select sub category</option>';
      if (cat && subCategoryMap[cat]) {
        subCategoryMap[cat].forEach(sc => {
          subSel.innerHTML += `<option>${sc}</option>`;
        });
      }
    }

    /* ═══════════════ ADD / EDIT ═══════════════ */
    function openProductModal(product) {
      document.getElementById("product-modal-title").textContent = product ? "Edit product" : "Add product";
      document.getElementById("pf-submit-btn").textContent = product ? "Update product" : "Save product";
      document.getElementById("pf-id").value = product ? product.id : "";
      document.getElementById("pf-name").value = product ? product.name : "";
      document.getElementById("pf-slug").value = product ? product.slug : "";
      document.getElementById("pf-short-desc").value = product ? product.shortDesc || "" : "";
      document.getElementById("pf-description").value = product ? product.description : "";
      document.getElementById("pf-category").value = product ? product.category : "";
      updateSubCategoryOptions();
      if (product) document.getElementById("pf-subcategory").value = product.subcategory || "";
      document.getElementById("pf-status").value = product ? product.status : "active";
      document.getElementById("pf-featured").checked = product ? product.featured : false;
      document.getElementById("pf-name-error").classList.add("hidden");
      document.getElementById("pf-slug-error").classList.add("hidden");

      // Inventory
      const manageInv = product ? product.manageInventory : false;
      document.getElementById("pf-manage-inventory").checked = manageInv;
      document.getElementById("pf-stock-qty").value = product ? product.stockQty : "";
      document.getElementById("pf-low-threshold").value = product ? product.lowThreshold : 5;
      document.getElementById("pf-stock-status").value = product ? product.stockStatus : "in-stock";
      toggleInventory();

      // Build variations
      const container = document.getElementById("variations-container");
      container.innerHTML = "";
      const vars = product ? product.variations : [{ weight: "", price: "", strikePrice: "", stock: "", sku: "", status: "active" }];
      vars.forEach((v) => addVariationRow(v));

      // Reset images
      resetMainImage(product ? product.mainImage : null);
      resetGallery(product ? product.galleryImages : []);

      AdminSlug.reset("pf-slug");
      AdminSlug.bind("pf-name", "pf-slug");
      AdminModal.open("product-modal");
    }

    /* ═══ Variation Rows ═══ */
    function addVariationRow(v = {}) {
      const container = document.getElementById("variations-container");
      const div = document.createElement("div");
      div.className = "variation-row rounded-xl border border-[#eadbc6] bg-[#fffcf7] p-4";
      div.innerHTML = `
        <div class="grid gap-3 sm:grid-cols-6">
          <div class="sm:col-span-2">
            <label class="mb-1 block text-[10px] font-semibold text-[#594b45]">Weight / Variant <span class="text-red-500">*</span></label>
            <input class="var-weight w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.weight || ""}" placeholder="e.g. 250g, 500g, 1kg" />
          </div>
          <div>
            <label class="mb-1 block text-[10px] font-semibold text-[#594b45]">Price (₹) <span class="text-red-500">*</span></label>
            <input type="number" class="var-price w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.price || ""}" placeholder="0" min="0" />
          </div>
          <div>
            <label class="mb-1 block text-[10px] font-semibold text-[#594b45]">Strike Price</label>
            <input type="number" class="var-strike w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.strikePrice || ""}" placeholder="0" min="0" />
          </div>
          <div>
            <label class="mb-1 block text-[10px] font-semibold text-[#594b45]">Stock Qty</label>
            <input type="number" class="var-stock w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.stock ?? ""}" placeholder="0" min="0" />
          </div>
          <div>
            <label class="mb-1 block text-[10px] font-semibold text-[#594b45]">SKU</label>
            <input class="var-sku w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#9b6b2c]" value="${v.sku || ""}" placeholder="Optional" />
          </div>
        </div>
        <div class="flex items-center justify-between mt-3">
          <div class="flex items-center gap-3">
            <label class="text-[10px] font-semibold text-[#594b45]">Status</label>
            <select class="var-status rounded-lg border border-[#eadbc6] bg-white px-2 py-1.5 text-xs">
              <option value="active" ${(v.status || 'active') === 'active' ? 'selected' : ''}>Active</option>
              <option value="inactive" ${v.status === 'inactive' ? 'selected' : ''}>Inactive</option>
            </select>
          </div>
          <button type="button" onclick="removeVariation(this)" class="var-remove-btn grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition">🗑</button>
        </div>`;
      container.appendChild(div);
      updateRemoveButtons();
    }

    function addVariation() { addVariationRow(); }

    function removeVariation(btn) {
      const container = document.getElementById("variations-container");
      if (container.querySelectorAll(".variation-row").length <= 1) return;
      btn.closest(".variation-row").remove();
      updateRemoveButtons();
    }

    function updateRemoveButtons() {
      const rows = document.querySelectorAll("#variations-container .variation-row");
      rows.forEach((row) => {
        const btn = row.querySelector(".var-remove-btn");
        if (rows.length <= 1) btn.classList.add("invisible");
        else btn.classList.remove("invisible");
      });
    }

    /* ═══ Inventory Toggle ═══ */
    function toggleInventory() {
      const checked = document.getElementById("pf-manage-inventory").checked;
      const fields = document.getElementById("inventory-fields");
      fields.classList.toggle("hidden", !checked);

      // Show variation note if multiple variations
      const varCount = document.querySelectorAll("#variations-container .variation-row").length;
      document.getElementById("inventory-variation-note").classList.toggle("hidden", varCount <= 1);
    }

    /* ═══ Image Handling ═══ */
    function resetMainImage(img) {
      const preview = document.getElementById("main-image-preview");
      if (img) {
        document.getElementById("main-image-img").src = img;
        preview.classList.remove("hidden");
      } else {
        preview.classList.add("hidden");
      }
      document.getElementById("main-image-input").value = "";
    }

    function previewMainImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById("main-image-img").src = e.target.result;
          document.getElementById("main-image-preview").classList.remove("hidden");
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removeMainImage() {
      document.getElementById("main-image-preview").classList.add("hidden");
      document.getElementById("main-image-input").value = "";
    }

    function resetGallery(images = []) {
      const area = document.getElementById("gallery-area");
      area.innerHTML = "";
      images.forEach((img, i) => {
        const div = document.createElement("div");
        div.className = "relative rounded-xl border border-[#eadbc6] bg-[#f3e7d5] p-4 flex items-center justify-center min-h-[100px]";
        div.innerHTML = `
          <span class="text-2xl">🖼</span>
          <span class="absolute top-1 left-2 text-[10px] font-bold text-[#9b6b2c]">#${i + 1}</span>
          <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-[10px] text-white shadow hover:bg-red-600">✕</button>`;
        area.appendChild(div);
      });
    }

    function previewGalleryImages(input) {
      if (!input.files) return;
      const area = document.getElementById("gallery-area");
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement("div");
          div.className = "relative rounded-xl border border-[#eadbc6] overflow-hidden min-h-[100px]";
          div.innerHTML = `
            <img src="${e.target.result}" class="h-full w-full object-cover min-h-[100px]" />
            <button type="button" onclick="this.parentElement.remove()" class="absolute -top-1 -right-1 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-[10px] text-white shadow hover:bg-red-600">✕</button>`;
          area.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
      input.value = "";
      AdminToast.show("Gallery images added", "info");
    }

    /* ═══ Save Product ═══ */
    function saveProduct(e) {
      e.preventDefault();
      const name = document.getElementById("pf-name").value.trim();
      const slug = document.getElementById("pf-slug").value.trim();
      let valid = true;
      if (!name) { document.getElementById("pf-name-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("pf-name-error").classList.add("hidden"); }
      if (!slug) { document.getElementById("pf-slug-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("pf-slug-error").classList.add("hidden"); }
      if (!valid) return;

      const variations = [];
      document.querySelectorAll("#variations-container .variation-row").forEach((row) => {
        variations.push({
          weight: row.querySelector(".var-weight").value || "Default",
          price: parseInt(row.querySelector(".var-price").value) || 0,
          strikePrice: parseInt(row.querySelector(".var-strike").value) || 0,
          stock: parseInt(row.querySelector(".var-stock").value) || 0,
          sku: row.querySelector(".var-sku").value || "",
          status: row.querySelector(".var-status").value || "active",
        });
      });

      // Validate at least one variation has a price
      if (!variations.some(v => v.price > 0)) {
        AdminToast.show("At least one variation must have a price", "error");
        return;
      }

      const mainImgEl = document.getElementById("main-image-img");
      const mainImage = !document.getElementById("main-image-preview").classList.contains("hidden") ? mainImgEl.src : null;
      const galleryCount = document.querySelectorAll("#gallery-area > div").length;
      const galleryImages = [];
      for (let i = 0; i < galleryCount; i++) galleryImages.push(`gallery-${i + 1}.jpg`);

      const id = document.getElementById("pf-id").value;
      const data = {
        name, slug,
        shortDesc: document.getElementById("pf-short-desc").value.trim(),
        description: document.getElementById("pf-description").value.trim(),
        category: document.getElementById("pf-category").value,
        subcategory: document.getElementById("pf-subcategory").value,
        variations,
        manageInventory: document.getElementById("pf-manage-inventory").checked,
        stockQty: parseInt(document.getElementById("pf-stock-qty").value) || 0,
        lowThreshold: parseInt(document.getElementById("pf-low-threshold").value) || 5,
        stockStatus: document.getElementById("pf-stock-status").value,
        status: document.getElementById("pf-status").value,
        featured: document.getElementById("pf-featured").checked,
        mainImage, galleryImages,
      };

      if (id) {
        const idx = products.findIndex((p) => p.id === parseInt(id));
        if (idx > -1) { products[idx] = { ...products[idx], ...data }; }
        AdminToast.show("Product updated successfully");
      } else {
        data.id = nextId++;
        products.push(data);
        AdminToast.show("Product added successfully");
      }

      AdminModal.close("product-modal");
      renderProducts();
    }

    function editProduct(id) {
      const p = products.find((x) => x.id === id);
      if (p) openProductModal(p);
    }

    /* ═══════════════ VIEW PRODUCT ═══════════════ */
    function viewProduct(id) {
      const p = products.find((x) => x.id === id);
      if (!p) return;
      const totalStock = p.variations.reduce((s, v) => s + v.stock, 0);
      const statusLabel = p.status === "active" ? "Active" : p.status === "draft" ? "Draft" : "Inactive";

      document.getElementById("product-view-body").innerHTML = `
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-2xl font-bold text-[#32110d]">${p.name}</h3>
          <span class="rounded-full ${p.status === 'active' ? 'bg-emerald-50 text-emerald-700' : p.status === 'draft' ? 'bg-amber-50 text-amber-700' : 'bg-gray-100 text-gray-600'} px-3 py-1 text-xs font-semibold">${statusLabel}</span>
          ${p.featured ? '<span class="rounded-full bg-purple-50 px-3 py-1 text-xs font-semibold text-purple-700">Featured</span>' : ""}
        </div>
        <p class="text-xs font-mono text-[#7e5a43]">/${p.slug}</p>
        ${p.shortDesc ? `<p class="text-sm text-[#594b45]">${p.shortDesc}</p>` : ""}
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
            <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Details</p>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between"><span class="text-[#7e5a43]">Category</span><span class="font-semibold">${p.category}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Sub Category</span><span class="font-semibold">${p.subcategory || "—"}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Total stock</span><span class="font-semibold ${totalStock === 0 ? "text-red-600" : ""}">${totalStock}</span></div>
              <div class="flex justify-between"><span class="text-[#7e5a43]">Inventory</span><span class="font-semibold">${p.manageInventory ? "Managed" : "Not managed"}</span></div>
            </div>
          </div>
          <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
            <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Images</p>
            <div class="flex gap-2 flex-wrap">
              ${p.mainImage ? '<div class="grid h-16 w-16 place-items-center rounded-lg bg-[#f3e7d5] text-xl text-[#9b6b2c] overflow-hidden"><img src="'+p.mainImage+'" class="h-full w-full object-cover"/></div>' : ""}
              ${p.galleryImages.length ? p.galleryImages.map(() => '<div class="grid h-16 w-16 place-items-center rounded-lg bg-[#f3e7d5] text-xl text-[#9b6b2c]">🖼</div>').join("") : '<p class="text-xs text-[#a89387]">No images uploaded</p>'}
            </div>
          </div>
        </div>
        ${p.description ? `<div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4"><p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-2">Description</p><p class="text-sm text-[#594b45] leading-relaxed">${p.description}</p></div>` : ""}
        <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
          <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c] mb-3">Variations & Pricing</p>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-xs text-[#9b6b2c] uppercase"><tr><th class="pb-2 text-left">Weight</th><th class="pb-2 text-left">Price</th><th class="pb-2 text-left">Strike</th><th class="pb-2 text-left">Stock</th><th class="pb-2 text-left">SKU</th></tr></thead>
              <tbody class="divide-y divide-[#eadbc6]">
                ${p.variations.map((v) => `<tr><td class="py-2 font-semibold">${v.weight}</td><td class="py-2">₹${v.price}</td><td class="py-2 ${v.strikePrice ? 'line-through text-[#a89387]' : 'text-[#a89387]'}">${v.strikePrice ? '₹'+v.strikePrice : '—'}</td><td class="py-2 ${v.stock === 0 ? "text-red-600 font-semibold" : ""}">${v.stock}</td><td class="py-2 font-mono text-xs">${v.sku || '—'}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
        <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-4">
          <button onclick="AdminModal.close('product-view-modal');editProduct(${p.id})" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Edit product</button>
        </div>`;
      AdminModal.open("product-view-modal");
    }

    /* ═══════════════ DELETE ═══════════════ */
    function deleteProduct(id) {
      const p = products.find((x) => x.id === id);
      if (!p) return;
      AdminConfirm.show(`Are you sure you want to delete this item? "${p.name}" will be permanently removed.`, () => {
        products = products.filter((x) => x.id !== id);
        renderProducts();
        AdminToast.show("Product deleted", "error");
      });
    }

    /* ═══════════════ INIT ═══════════════ */
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderProducts, 100);
    });
  </script>
  <script src="assets/admin-api.js"></script>
  <script src="assets/products/products.js"></script>
</body>
</html>
