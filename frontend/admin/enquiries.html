<!doctype html>
<html lang="en">
  <head>
    <script src="assets/admin-auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries | Nellai Specialz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body data-admin-page="enquiries" data-admin-title="Enquiries" class="bg-[#f8f1e7] text-[#3a110d]">
    <div data-admin-shell></div>

    <template id="admin-page-content">
      <section class="space-y-6">
        <p class="text-sm text-[#7e5a43]">Review contact and bulk order enquiries submitted through the storefront.</p>

        <div id="enquiries-status" class="hidden rounded-xl px-4 py-3 text-sm" role="status" aria-live="polite"></div>

        <div class="flex flex-wrap items-center gap-2 rounded-xl border border-[#eadbc6] bg-white p-2">
          <button type="button" data-enquiry-type="ALL" class="rounded-lg bg-[#54170f] px-4 py-2.5 text-sm font-semibold text-white">All</button>
          <button type="button" data-enquiry-type="CONTACT" class="rounded-lg px-4 py-2.5 text-sm font-semibold text-[#594b45]">Contact Enquiries</button>
          <button type="button" data-enquiry-type="BULK_ORDER" class="rounded-lg px-4 py-2.5 text-sm font-semibold text-[#594b45]">Corporate / Bulk Enquiries</button>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">
          <input id="enquiry-search" type="search" maxlength="150" class="w-full rounded-xl border border-[#eadbc6] bg-white px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] sm:max-w-sm" placeholder="Search enquiries">
          <select id="enquiry-status-filter" class="rounded-xl border border-[#eadbc6] bg-white px-4 py-3 text-sm">
            <option value="">All statuses</option>
            <option value="NEW">New</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
          </select>
          <button id="enquiries-refresh" type="button" class="rounded-xl border border-[#eadbc6] bg-white px-4 py-3 text-sm font-semibold">Refresh</button>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
          <table class="w-full min-w-[780px] text-left text-sm">
            <thead id="enquiries-head" class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]"></thead>
            <tbody id="enquiries-body" class="divide-y divide-[#f0e5d8]"></tbody>
          </table>
          <p id="enquiries-empty" class="hidden py-12 text-center text-sm text-[#7e5a43]">No enquiries match these filters.</p>
        </div>
      </section>

      <div id="enquiry-view-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4" aria-modal="true" role="dialog" aria-labelledby="enquiry-modal-title">
        <div data-modal-box class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl">
          <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4">
            <h2 id="enquiry-modal-title" class="text-xl font-bold text-[#32110d]">Enquiry details</h2>
            <button type="button" data-close-enquiry-modal class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45]" aria-label="Close enquiry details">×</button>
          </div>
          <div id="enquiry-detail" class="space-y-4 p-6"></div>
          <form id="enquiry-update-form" class="space-y-4 border-t border-[#eee8e2] p-6">
            <label class="block text-sm font-semibold text-[#594b45]">Status
              <select id="enquiry-detail-status" class="mt-2 w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3">
                <option value="NEW">New</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
              </select>
            </label>
            <label class="block text-sm font-semibold text-[#594b45]">Admin notes
              <textarea id="enquiry-admin-notes" maxlength="3000" rows="4" class="mt-2 w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 font-normal" placeholder="Internal notes (not visible to the customer)"></textarea>
            </label>
            <div class="flex justify-end gap-3">
              <button type="button" data-close-enquiry-modal class="rounded-xl border border-[#e8e1da] px-5 py-3 text-sm font-semibold text-[#594b45]">Close</button>
              <button id="enquiry-save-button" type="submit" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </template>

    <script src="assets/admin.js" defer></script>
    <script src="assets/enquiries/enquiries.js" defer></script>
  </body>
</html>
