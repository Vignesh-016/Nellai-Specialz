<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiries | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="enquiries" data-admin-title="Enquiries">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <p class="text-sm text-[#7e5a43]">Review customer questions and business enquiries.</p>
      <div class="rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
        <div class="space-y-1">
          <div class="flex flex-col gap-3 border-b border-[#f0e5d8] py-5 sm:flex-row sm:items-center sm:justify-between"><div><div class="flex items-center gap-3"><h2 class="font-semibold">Priya S.</h2><span class="rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">New</span></div><p class="mt-1 text-sm text-[#7e5a43]">Bulk order enquiry for a wedding function</p></div><span class="text-xs text-[#9b6b2c]">Today, 10:24 AM</span></div>
          <div class="flex flex-col gap-3 border-b border-[#f0e5d8] py-5 sm:flex-row sm:items-center sm:justify-between"><div><div class="flex items-center gap-3"><h2 class="font-semibold">Ramesh Kumar</h2><span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">In progress</span></div><p class="mt-1 text-sm text-[#7e5a43]">Need delivery details for Chennai</p></div><span class="text-xs text-[#9b6b2c]">Yesterday, 4:12 PM</span></div>
          <div class="flex flex-col gap-3 py-5 sm:flex-row sm:items-center sm:justify-between"><div><div class="flex items-center gap-3"><h2 class="font-semibold">Anitha M.</h2><span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">Resolved</span></div><p class="mt-1 text-sm text-[#7e5a43]">Question about ingredients and preservatives</p></div><span class="text-xs text-[#9b6b2c]">18 Sep 2026</span></div>
        </div>
      </div>
    </section>
  </template>

  <script src="assets/admin.js" defer></script>
</body>
</html>
