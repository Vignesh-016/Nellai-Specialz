<!doctype html>
<html lang="en">
  <head><script src="assets/admin-auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupons | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="coupons" data-admin-title="Coupons" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Create discount codes for customers to use at checkout.</p>
        <button type="button" onclick="AdminCoupons.open()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Create coupon</button>
      </div>

      <div class="rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[1000px] text-left text-sm">
            <thead class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]">
              <tr>
                <th class="p-3">Code</th>
                <th class="p-3">Title</th>
                <th class="p-3">Discount</th>
                <th class="p-3">Applies to</th>
                <th class="p-3">Min. Order</th>
                <th class="p-3">Start Date</th>
                <th class="p-3">Expiry</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="coupons-tbody" class="divide-y divide-[#f0e5d8]"></tbody>
          </table>
        </div>
        <div id="coupons-empty" class="hidden py-12 text-center text-sm text-[#7e5a43]">No coupons yet.</div>
      </div>
    </section>

    <!-- CREATE/EDIT COUPON MODAL -->
    <div id="coupon-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="coupon-modal-title" class="text-xl font-bold text-[#32110d]">Create coupon</h2>
          <button onclick="AdminModal.close('coupon-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form id="couponForm" class="p-6 space-y-5">
          <input type="hidden" id="cpf-id" />

          <!-- Code & Title -->
          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Coupon code <span class="text-red-500">*</span></label>
              <input id="cpf-code" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm font-mono uppercase outline-none focus:border-[#9b6b2c]" placeholder="e.g. WELCOME10" />
              <p id="cpf-code-error" class="mt-1 text-xs text-red-600 hidden">Coupon code is required.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Coupon title <span class="text-red-500">*</span></label>
              <input id="cpf-title" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Welcome Discount" />
              <p id="cpf-title-error" class="mt-1 text-xs text-red-600 hidden">Coupon title is required.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Description</label>
              <textarea id="cpf-desc" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Brief description of the coupon..."></textarea>
            </div>
          </div>

          <!-- Discount -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Discount</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Discount type</label>
                <select id="cpf-type" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="PERCENTAGE">Percentage (%)</option>
                  <option value="FIXED">Flat Amount (₹)</option>
                </select>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Discount value <span class="text-red-500">*</span></label>
                <input id="cpf-value" type="number" required min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" />
                <p id="cpf-value-error" class="mt-1 text-xs text-red-600 hidden">Discount value is required.</p>
              </div>
            </div>
          </div>

          <!-- Application Rules -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Application rules</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Minimum order amount (₹)</label>
                <input id="cpf-min" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="No minimum" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Maximum discount (₹)</label>
                <input id="cpf-max-discount" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="No maximum" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Start date</label>
                <input id="cpf-start" type="date" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Expiry date</label>
                <input id="cpf-expiry" type="date" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Usage limit (total)</label>
                <input id="cpf-max-uses" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="Unlimited" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Per user limit</label>
                <input id="cpf-per-user" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="Unlimited" />
              </div>
            </div>
          </div>

          <!-- Applies To -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Applies To</h3>
            <select id="cpf-applies" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
              <option value="ALL">All Products</option>
              <option value="PRODUCTS">Selected Products</option>
              <option value="CATEGORIES">Selected Categories</option>
            </select>
          </div>

          <!-- Status -->
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Status</label>
            <select id="cpf-status" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>

          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('coupon-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" id="couponSubmitBtn" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Save coupon</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script type="application/legacy-disabled">
    let coupons = [
      { id: 1, code: "WELCOME10", title: "Welcome Discount", desc: "10% off for new customers on their first order.", type: "percent", value: 10, applies: "All Products", minOrder: 0, maxDiscount: 200, maxUses: 200, perUser: 1, used: 64, start: "2026-01-01", expiry: "2026-12-31", status: "active" },
      { id: 2, code: "FESTIVE25", title: "Festive Season Offer", desc: "₹250 flat discount on orders above ₹1500.", type: "flat", value: 250, applies: "All Products", minOrder: 1500, maxDiscount: 0, maxUses: 100, perUser: 0, used: 89, start: "2026-10-01", expiry: "2026-11-15", status: "active" },
      { id: 3, code: "DIWALI50", title: "Diwali Combo Special", desc: "15% off on all combo products during Diwali.", type: "percent", value: 15, applies: "Selected Categories", minOrder: 1000, maxDiscount: 500, maxUses: 50, perUser: 1, used: 12, start: "2026-10-15", expiry: "2026-11-05", status: "active" },
      { id: 4, code: "HALWA20", title: "Halwa Lovers", desc: "₹100 off on all halwa products.", type: "flat", value: 100, applies: "Selected Categories", minOrder: 500, maxDiscount: 0, maxUses: 0, perUser: 0, used: 33, start: "", expiry: "", status: "inactive" },
    ];
    let nextCpId = 5;

    function renderCoupons() {
      const tbody = document.getElementById("coupons-tbody");
      const empty = document.getElementById("coupons-empty");

      if (!coupons.length) {
        tbody.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      tbody.innerHTML = coupons.map(c => {
        const discount = c.type === "percent" ? `${c.value}% off` : `₹${c.value} off`;
        const minOrder = c.minOrder ? `₹${c.minOrder.toLocaleString()}` : "None";
        const startDate = c.start ? new Date(c.start).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";
        const expiry = c.expiry ? new Date(c.expiry).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "Never";
        const statusColor = c.status === "active" ? "bg-emerald-50 text-emerald-700" : "bg-gray-100 text-gray-600";
        const statusLabel = c.status === "active" ? "Active" : "Inactive";

        return `
          <tr class="hover:bg-[#fffcf7] transition">
            <td class="p-3"><span class="font-bold text-[#8e281d] font-mono">${c.code}</span></td>
            <td class="p-3 font-semibold text-[#32110d]">${c.title}</td>
            <td class="p-3 font-semibold">${discount}</td>
            <td class="p-3 text-[#594b45]">${c.applies}</td>
            <td class="p-3">${minOrder}</td>
            <td class="p-3 text-xs">${startDate}</td>
            <td class="p-3 text-xs">${expiry}</td>
            <td class="p-3"><span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold">${statusLabel}</span></td>
            <td class="p-3">
              <div class="flex justify-end gap-2">
                <button onclick="editCoupon(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition" title="Edit">✎</button>
                <button onclick="deleteCoupon(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition" title="Delete">🗑</button>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    function openCouponModal(cp) {
      document.getElementById("coupon-modal-title").textContent = cp ? "Edit coupon" : "Create coupon";
      document.getElementById("cpf-submit-btn").textContent = cp ? "Update coupon" : "Save coupon";
      document.getElementById("cpf-id").value = cp ? cp.id : "";
      document.getElementById("cpf-code").value = cp ? cp.code : "";
      document.getElementById("cpf-title").value = cp ? cp.title : "";
      document.getElementById("cpf-desc").value = cp ? cp.desc : "";
      document.getElementById("cpf-type").value = cp ? cp.type : "percent";
      document.getElementById("cpf-value").value = cp ? cp.value : "";
      document.getElementById("cpf-applies").value = cp ? cp.applies : "All Products";
      document.getElementById("cpf-min").value = cp && cp.minOrder ? cp.minOrder : "";
      document.getElementById("cpf-max-discount").value = cp && cp.maxDiscount ? cp.maxDiscount : "";
      document.getElementById("cpf-max-uses").value = cp && cp.maxUses ? cp.maxUses : "";
      document.getElementById("cpf-per-user").value = cp && cp.perUser ? cp.perUser : "";
      document.getElementById("cpf-start").value = cp ? cp.start : "";
      document.getElementById("cpf-expiry").value = cp ? cp.expiry : "";
      document.getElementById("cpf-status").value = cp ? cp.status : "active";
      document.getElementById("cpf-code-error").classList.add("hidden");
      document.getElementById("cpf-title-error").classList.add("hidden");
      document.getElementById("cpf-value-error").classList.add("hidden");
      AdminModal.open("coupon-modal");
    }

    function saveCoupon(e) {
      e.preventDefault();
      const code = document.getElementById("cpf-code").value.trim().toUpperCase();
      const title = document.getElementById("cpf-title").value.trim();
      const value = document.getElementById("cpf-value").value;
      let valid = true;

      if (!code) { document.getElementById("cpf-code-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("cpf-code-error").classList.add("hidden"); }
      if (!title) { document.getElementById("cpf-title-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("cpf-title-error").classList.add("hidden"); }
      if (!value || parseInt(value) <= 0) { document.getElementById("cpf-value-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("cpf-value-error").classList.add("hidden"); }
      if (!valid) return;

      const id = document.getElementById("cpf-id").value;
      const data = {
        code, title,
        desc: document.getElementById("cpf-desc").value.trim(),
        type: document.getElementById("cpf-type").value,
        value: parseInt(value) || 0,
        applies: document.getElementById("cpf-applies").value,
        minOrder: parseInt(document.getElementById("cpf-min").value) || 0,
        maxDiscount: parseInt(document.getElementById("cpf-max-discount").value) || 0,
        maxUses: parseInt(document.getElementById("cpf-max-uses").value) || 0,
        perUser: parseInt(document.getElementById("cpf-per-user").value) || 0,
        start: document.getElementById("cpf-start").value,
        expiry: document.getElementById("cpf-expiry").value,
        status: document.getElementById("cpf-status").value,
      };

      // Date validation
      if (data.start && data.expiry && data.start > data.expiry) {
        AdminToast.show("Start date cannot be after expiry date", "error");
        return;
      }

      if (id) {
        const idx = coupons.findIndex(c => c.id === parseInt(id));
        if (idx > -1) coupons[idx] = { ...coupons[idx], ...data };
        AdminToast.show("Coupon updated");
      } else {
        data.id = nextCpId++;
        data.used = 0;
        coupons.push(data);
        AdminToast.show("Coupon created");
      }

      AdminModal.close("coupon-modal");
      renderCoupons();
    }

    function editCoupon(id) {
      const c = coupons.find(x => x.id === id);
      if (c) openCouponModal(c);
    }

    function deleteCoupon(id) {
      const c = coupons.find(x => x.id === id);
      if (!c) return;
      AdminConfirm.show(`Are you sure you want to delete this item? Coupon "${c.code}" will be permanently removed.`, () => {
        coupons = coupons.filter(x => x.id !== id);
        renderCoupons();
        AdminToast.show("Coupon deleted", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderCoupons, 100);
    });
  </script>
  <script src="assets/admin-api.js"></script>
  <script src="assets/coupons/coupons.js"></script>
</body>
</html>
