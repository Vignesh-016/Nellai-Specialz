<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="offers" data-admin-title="Offers" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Create and manage promotional offers for the storefront.</p>
        <button onclick="openOfferModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Create offer</button>
      </div>

      <div id="offers-grid" class="grid gap-5 lg:grid-cols-2"></div>
      <div id="offers-empty" class="hidden rounded-2xl border border-[#eadbc6] bg-white py-12 text-center text-sm text-[#7e5a43]">No offers created yet.</div>
    </section>

    <!-- CREATE/EDIT OFFER MODAL -->
    <div id="offer-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="offer-modal-title" class="text-xl font-bold text-[#32110d]">Create offer</h2>
          <button onclick="AdminModal.close('offer-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form onsubmit="saveOffer(event)" class="p-6 space-y-5">
          <input type="hidden" id="of-id" />
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Offer title <span class="text-red-500">*</span></label>
            <input id="of-title" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Diwali Special — 20% off all combos" />
            <p id="of-title-error" class="mt-1 text-xs text-red-600 hidden">Offer title is required.</p>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Description</label>
            <textarea id="of-description" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Describe the offer..."></textarea>
          </div>

          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Offer rules</h3>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Offer type</label>
                <select id="of-type" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option value="percent">Percentage discount</option>
                  <option value="flat">Flat discount (₹)</option>
                  <option value="bogo">Buy one get one</option>
                  <option value="freeShip">Free shipping</option>
                  <option value="bundle">Bundle deal</option>
                </select>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Discount value</label>
                <input id="of-value" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" />
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Applies to</label>
                <select id="of-applies" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                  <option>All products</option>
                  <option>Halwa only</option>
                  <option>Combos only</option>
                  <option>New customers</option>
                  <option>Orders above ₹1000</option>
                  <option>Orders above ₹2000</option>
                </select>
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Valid until</label>
                <input id="of-expiry" type="date" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" />
              </div>
            </div>
          </div>

          <div class="flex flex-wrap gap-4">
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" id="of-banner" class="h-4 w-4 rounded border-[#d5c5b0] accent-[#8e281d]" />
              <span class="text-sm font-semibold text-[#594b45]">Show as banner</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" id="of-active" checked class="h-4 w-4 rounded border-[#d5c5b0] accent-[#8e281d]" />
              <span class="text-sm font-semibold text-[#594b45]">Active</span>
            </label>
          </div>

          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('offer-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Save offer</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script>
    let offers = [
      { id: 1, title: "Welcome 10% off", description: "10% discount on first order for new customers.", type: "percent", value: 10, applies: "New customers", expiry: "2026-12-31", banner: true, active: true },
      { id: 2, title: "Festive ₹250 off", description: "₹250 off on orders above ₹1,500. Perfect for festive season.", type: "flat", value: 250, applies: "Orders above ₹1000", expiry: "2026-11-15", banner: true, active: true },
      { id: 3, title: "Free shipping on combos", description: "All combo orders ship free across India.", type: "freeShip", value: 0, applies: "Combos only", expiry: "", banner: false, active: true },
    ];
    let nextOfferId = 4;

    const typeLabels = { percent: "% off", flat: "₹ off", bogo: "BOGO", freeShip: "Free shipping", bundle: "Bundle" };

    function renderOffers() {
      const grid = document.getElementById("offers-grid");
      const empty = document.getElementById("offers-empty");
      if (!offers.length) { grid.innerHTML = ""; empty.classList.remove("hidden"); return; }
      empty.classList.add("hidden");

      grid.innerHTML = offers.map(o => {
        const typeTag = typeLabels[o.type] || o.type;
        const discountDisplay = o.type === "percent" ? `${o.value}% off` : o.type === "flat" ? `₹${o.value} off` : typeTag;
        const expiry = o.expiry ? new Date(o.expiry).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "No expiry";
        const statusColor = o.active ? "bg-emerald-50 text-emerald-700" : "bg-gray-100 text-gray-600";

        return `
        <article class="group rounded-2xl border border-[#eadbc6] bg-white p-6 hover:shadow-lg hover:shadow-[#eadbc6]/40 transition-all duration-200">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="font-serif text-lg font-bold text-[#32110d]">${o.title}</h2>
                ${o.banner ? '<span class="rounded-full bg-purple-50 px-2 py-0.5 text-[10px] font-bold text-purple-700">Banner</span>' : ""}
              </div>
              ${o.description ? `<p class="mt-1 text-sm text-[#7e5a43]">${o.description}</p>` : ""}
            </div>
            <span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold shrink-0">${o.active ? "Active" : "Inactive"}</span>
          </div>
          <div class="mt-4 flex flex-wrap gap-2">
            <span class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#9b6b2c]">${discountDisplay}</span>
            <span class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#9b6b2c]">${o.applies}</span>
            <span class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#9b6b2c]">Expires: ${expiry}</span>
          </div>
          <div class="mt-4 flex gap-2 justify-end border-t border-[#f0e5d8] pt-4">
            <button onclick="editOffer(${o.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition" title="Edit">✎</button>
            <button onclick="deleteOffer(${o.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition" title="Delete">🗑</button>
          </div>
        </article>`;
      }).join("");
    }

    function openOfferModal(offer) {
      document.getElementById("offer-modal-title").textContent = offer ? "Edit offer" : "Create offer";
      document.getElementById("of-id").value = offer ? offer.id : "";
      document.getElementById("of-title").value = offer ? offer.title : "";
      document.getElementById("of-description").value = offer ? offer.description : "";
      document.getElementById("of-type").value = offer ? offer.type : "percent";
      document.getElementById("of-value").value = offer ? offer.value : "";
      document.getElementById("of-applies").value = offer ? offer.applies : "All products";
      document.getElementById("of-expiry").value = offer ? offer.expiry : "";
      document.getElementById("of-banner").checked = offer ? offer.banner : false;
      document.getElementById("of-active").checked = offer ? offer.active : true;
      document.getElementById("of-title-error").classList.add("hidden");
      AdminModal.open("offer-modal");
    }

    function saveOffer(e) {
      e.preventDefault();
      const title = document.getElementById("of-title").value.trim();
      if (!title) { document.getElementById("of-title-error").classList.remove("hidden"); return; }
      document.getElementById("of-title-error").classList.add("hidden");

      const id = document.getElementById("of-id").value;
      const data = {
        title,
        description: document.getElementById("of-description").value.trim(),
        type: document.getElementById("of-type").value,
        value: parseInt(document.getElementById("of-value").value) || 0,
        applies: document.getElementById("of-applies").value,
        expiry: document.getElementById("of-expiry").value,
        banner: document.getElementById("of-banner").checked,
        active: document.getElementById("of-active").checked,
      };

      if (id) {
        const idx = offers.findIndex(o => o.id === parseInt(id));
        if (idx > -1) offers[idx] = { ...offers[idx], ...data };
        AdminToast.show("Offer updated");
      } else {
        data.id = nextOfferId++;
        offers.push(data);
        AdminToast.show("Offer created");
      }

      AdminModal.close("offer-modal");
      renderOffers();
    }

    function editOffer(id) {
      const o = offers.find(x => x.id === id);
      if (o) openOfferModal(o);
    }

    function deleteOffer(id) {
      const o = offers.find(x => x.id === id);
      if (!o) return;
      AdminConfirm.show(`Delete offer "${o.title}"?`, () => {
        offers = offers.filter(x => x.id !== id);
        renderOffers();
        AdminToast.show("Offer deleted", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderOffers, 100);
    });
  </script>
</body>
</html>
