<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combo Products | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="combos" data-admin-title="Combo Products" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Build combo boxes by bundling individual products together.</p>
        <button onclick="openComboModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Create combo</button>
      </div>

      <div id="combos-grid" class="grid gap-5 lg:grid-cols-2"></div>
      <div id="combos-empty" class="hidden rounded-2xl border border-[#eadbc6] bg-white py-12 text-center text-sm text-[#7e5a43]">No combo products yet. Create one to get started.</div>
    </section>

    <!-- COMBO BUILDER MODAL -->
    <div id="combo-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="combo-modal-title" class="text-xl font-bold text-[#32110d]">Create combo</h2>
          <button onclick="AdminModal.close('combo-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form onsubmit="saveCombo(event)" class="p-6 space-y-6">
          <input type="hidden" id="cmf-id" />
          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Combo name <span class="text-red-500">*</span></label>
              <input id="cmf-name" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Diwali Gift Box" />
              <p id="cmf-name-error" class="mt-1 text-xs text-red-600 hidden">Combo name is required.</p>
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Combo price (₹) <span class="text-red-500">*</span></label>
              <input id="cmf-price" type="number" required min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" />
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Stock</label>
              <input id="cmf-stock" type="number" min="0" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="0" />
            </div>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Description</label>
            <textarea id="cmf-description" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Describe the combo..."></textarea>
          </div>

          <!-- Combo Builder: product items -->
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">Included products</h3>
              <button type="button" onclick="addComboItem()" class="rounded-lg bg-[#f3e7d5] px-3 py-1.5 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">+ Add item</button>
            </div>
            <div id="combo-items-container" class="space-y-3"></div>
            <p id="combo-items-error" class="text-xs text-red-600 hidden">Add at least 2 products to the combo.</p>
          </div>

          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="cmf-active" checked class="h-4 w-4 rounded border-[#d5c5b0] accent-[#8e281d]" />
            <span class="text-sm font-semibold text-[#594b45]">Active (visible in store)</span>
          </label>

          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('combo-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Save combo</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script>
    const availableProducts = [
      "Tirunelveli Karupatti Halwa (250g)",
      "Tirunelveli Karupatti Halwa (500g)",
      "Ghee Halwa (250g)",
      "Ghee Halwa (500g)",
      "Muscoth Halwa (250g)",
      "Muscoth Halwa (500g)",
      "Cashew Halwa (250g)",
      "Cashew Halwa (500g)",
      "Wheat Halwa (500g)",
    ];

    let combos = [
      {
        id: 1, name: "Traditional Halwa Combo", price: 1500, stock: 12, active: true,
        description: "Three heritage halwa varieties in an elegant gift box.",
        items: [
          { product: "Tirunelveli Karupatti Halwa (250g)", qty: 1 },
          { product: "Ghee Halwa (250g)", qty: 1 },
          { product: "Muscoth Halwa (250g)", qty: 1 },
        ],
      },
      {
        id: 2, name: "Diwali Gift Box", price: 2200, stock: 8, active: true,
        description: "Premium Diwali special with five halwa varieties beautifully packed.",
        items: [
          { product: "Tirunelveli Karupatti Halwa (500g)", qty: 1 },
          { product: "Ghee Halwa (500g)", qty: 1 },
          { product: "Cashew Halwa (250g)", qty: 1 },
        ],
      },
      {
        id: 3, name: "Sampler Pack", price: 750, stock: 0, active: false,
        description: "A tasting selection with smaller portions of our most popular halwas.",
        items: [
          { product: "Ghee Halwa (250g)", qty: 1 },
          { product: "Muscoth Halwa (250g)", qty: 1 },
        ],
      },
    ];
    let nextComboId = 4;

    function renderCombos() {
      const grid = document.getElementById("combos-grid");
      const empty = document.getElementById("combos-empty");
      if (!combos.length) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      grid.innerHTML = combos.map(c => {
        const statusColor = !c.active ? "bg-gray-100 text-gray-600" : c.stock === 0 ? "bg-red-50 text-red-700" : "bg-emerald-50 text-emerald-700";
        const statusLabel = !c.active ? "Inactive" : c.stock === 0 ? "Out of stock" : "Active";
        return `
        <article class="group rounded-2xl border border-[#eadbc6] bg-white p-6 hover:shadow-lg hover:shadow-[#eadbc6]/40 transition-all duration-200">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-[#f3e7d5] text-xl text-[#9b6b2c]">⊞</span>
              <div>
                <h2 class="font-serif text-lg font-bold text-[#32110d]">${c.name}</h2>
                <p class="text-xs text-[#7e5a43]">${c.items.length} items · Stock: ${c.stock}</p>
              </div>
            </div>
            <span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold shrink-0">${statusLabel}</span>
          </div>
          ${c.description ? `<p class="mt-3 text-sm text-[#7e5a43] leading-relaxed">${c.description}</p>` : ""}
          <div class="mt-4 space-y-1.5">
            <p class="text-[10px] font-bold uppercase tracking-wider text-[#9b6b2c]">Includes</p>
            ${c.items.map(i => `<div class="flex items-center justify-between rounded-lg bg-[#fffcf7] border border-[#f0e5d8] px-3 py-2 text-xs"><span>${i.product}</span><span class="font-semibold text-[#594b45]">×${i.qty}</span></div>`).join("")}
          </div>
          <div class="mt-4 flex items-center justify-between border-t border-[#f0e5d8] pt-4">
            <p class="text-lg font-bold text-[#32110d]">₹${c.price.toLocaleString()}</p>
            <div class="flex gap-2">
              <button onclick="editCombo(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition" title="Edit">✎</button>
              <button onclick="deleteCombo(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition" title="Delete">🗑</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    function openComboModal(combo) {
      document.getElementById("combo-modal-title").textContent = combo ? "Edit combo" : "Create combo";
      document.getElementById("cmf-id").value = combo ? combo.id : "";
      document.getElementById("cmf-name").value = combo ? combo.name : "";
      document.getElementById("cmf-price").value = combo ? combo.price : "";
      document.getElementById("cmf-stock").value = combo ? combo.stock : "";
      document.getElementById("cmf-description").value = combo ? combo.description : "";
      document.getElementById("cmf-active").checked = combo ? combo.active : true;
      document.getElementById("cmf-name-error").classList.add("hidden");
      document.getElementById("combo-items-error").classList.add("hidden");

      const container = document.getElementById("combo-items-container");
      container.innerHTML = "";
      const items = combo ? combo.items : [{ product: "", qty: 1 }];
      items.forEach(i => addComboItemRow(i));

      AdminModal.open("combo-modal");
    }

    function addComboItemRow(item = {}) {
      const container = document.getElementById("combo-items-container");
      const div = document.createElement("div");
      div.className = "combo-item flex gap-3 items-end rounded-xl border border-[#eadbc6] bg-[#fffcf7] p-3";
      div.innerHTML = `
        <div class="flex-1">
          <label class="mb-1 block text-xs font-semibold text-[#594b45]">Product</label>
          <select class="ci-product w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm">
            <option value="">Select product</option>
            ${availableProducts.map(p => `<option ${p === item.product ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </div>
        <div class="w-20">
          <label class="mb-1 block text-xs font-semibold text-[#594b45]">Qty</label>
          <input type="number" class="ci-qty w-full rounded-lg border border-[#eadbc6] bg-white px-3 py-2.5 text-sm" value="${item.qty || 1}" min="1" />
        </div>
        <button type="button" onclick="removeComboItem(this)" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition">✕</button>`;
      container.appendChild(div);
    }

    function addComboItem() { addComboItemRow(); }

    function removeComboItem(btn) {
      const container = document.getElementById("combo-items-container");
      if (container.querySelectorAll(".combo-item").length <= 1) return;
      btn.closest(".combo-item").remove();
    }

    function saveCombo(e) {
      e.preventDefault();
      const name = document.getElementById("cmf-name").value.trim();
      if (!name) { document.getElementById("cmf-name-error").classList.remove("hidden"); return; }
      document.getElementById("cmf-name-error").classList.add("hidden");

      const items = [];
      document.querySelectorAll("#combo-items-container .combo-item").forEach(row => {
        const product = row.querySelector(".ci-product").value;
        const qty = parseInt(row.querySelector(".ci-qty").value) || 1;
        if (product) items.push({ product, qty });
      });

      if (items.length < 2) {
        document.getElementById("combo-items-error").classList.remove("hidden");
        return;
      }
      document.getElementById("combo-items-error").classList.add("hidden");

      const id = document.getElementById("cmf-id").value;
      const data = {
        name,
        price: parseInt(document.getElementById("cmf-price").value) || 0,
        stock: parseInt(document.getElementById("cmf-stock").value) || 0,
        description: document.getElementById("cmf-description").value.trim(),
        active: document.getElementById("cmf-active").checked,
        items,
      };

      if (id) {
        const idx = combos.findIndex(c => c.id === parseInt(id));
        if (idx > -1) combos[idx] = { ...combos[idx], ...data };
        AdminToast.show("Combo updated");
      } else {
        data.id = nextComboId++;
        combos.push(data);
        AdminToast.show("Combo created");
      }

      AdminModal.close("combo-modal");
      renderCombos();
    }

    function editCombo(id) {
      const c = combos.find(x => x.id === id);
      if (c) openComboModal(c);
    }

    function deleteCombo(id) {
      const c = combos.find(x => x.id === id);
      if (!c) return;
      AdminConfirm.show(`Delete combo "${c.name}"?`, () => {
        combos = combos.filter(x => x.id !== id);
        renderCombos();
        AdminToast.show("Combo deleted", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderCombos, 100);
    });
  </script>
</body>
</html>
