<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="categories" data-admin-title="Categories" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6" id="categories-section">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Organise products into easy-to-browse collections.</p>
        <button onclick="openCategoryModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Add category</button>
      </div>

      <div id="categories-grid" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
    </section>

    <!-- ═══════════════ ADD/EDIT CATEGORY MODAL ═══════════════ -->
    <div id="category-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-md rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="flex items-center justify-between border-b border-[#eee8e2] px-6 py-4">
          <h2 id="category-modal-title" class="text-xl font-bold text-[#32110d]">Add category</h2>
          <button onclick="AdminModal.close('category-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form onsubmit="saveCategory(event)" class="p-6 space-y-5">
          <input type="hidden" id="cf-id" />
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Category name <span class="text-red-500">*</span></label>
            <input id="cf-name" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="e.g. Halwa, Snacks, Gift Boxes" />
            <p id="cf-name-error" class="mt-1 text-xs text-red-600 hidden">Category name is required.</p>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Description</label>
            <textarea id="cf-description" rows="3" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Brief description of this category..."></textarea>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Display icon</label>
            <div class="flex gap-2 flex-wrap" id="cf-icon-picker">
              <button type="button" data-icon="◈" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">◈</button>
              <button type="button" data-icon="✦" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">✦</button>
              <button type="button" data-icon="♢" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">♢</button>
              <button type="button" data-icon="◆" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">◆</button>
              <button type="button" data-icon="★" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">★</button>
              <button type="button" data-icon="▣" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">▣</button>
              <button type="button" data-icon="⊛" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">⊛</button>
              <button type="button" data-icon="⬡" class="icon-pick grid h-10 w-10 place-items-center rounded-lg border border-[#eadbc6] text-lg hover:border-[#9b6b2c] transition">⬡</button>
            </div>
            <input type="hidden" id="cf-icon" value="◈" />
          </div>
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="cf-active" checked class="h-4 w-4 rounded border-[#d5c5b0] accent-[#8e281d]" />
            <span class="text-sm font-semibold text-[#594b45]">Active (visible in store)</span>
          </label>
          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('category-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Save category</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script>
    let categories = [
      { id: 1, name: "Halwa", icon: "◈", description: "Traditional Tirunelveli halwa varieties made with pure ghee.", productCount: 18, active: true },
      { id: 2, name: "Combos", icon: "✦", description: "Curated gift boxes and combo packs for festivals and celebrations.", productCount: 7, active: true },
      { id: 3, name: "Savouries", icon: "♢", description: "Crispy snacks and traditional savoury items.", productCount: 23, active: true },
      { id: 4, name: "Gift Boxes", icon: "★", description: "Premium gifting options for special occasions.", productCount: 5, active: false },
    ];
    let nextCatId = 5;
    let selectedIcon = "◈";

    function renderCategories() {
      const grid = document.getElementById("categories-grid");
      grid.innerHTML = categories.map(c => `
        <article class="group rounded-2xl border border-[#eadbc6] bg-white p-6 hover:shadow-lg hover:shadow-[#eadbc6]/40 transition-all duration-200">
          <div class="flex items-center justify-between">
            <span class="grid h-12 w-12 place-items-center rounded-xl bg-[#f3e7d5] text-2xl text-[#9b6b2c] group-hover:scale-110 transition-transform">${c.icon}</span>
            <div class="flex gap-2">
              <button onclick="editCategory(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition" title="Edit">✎</button>
              <button onclick="deleteCategory(${c.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition" title="Delete">🗑</button>
            </div>
          </div>
          <h2 class="mt-5 font-serif text-xl font-bold">${c.name}</h2>
          <p class="mt-1 text-sm text-[#7e5a43]">${c.productCount} products</p>
          ${c.description ? `<p class="mt-2 text-xs text-[#a89387] leading-5">${c.description}</p>` : ""}
          ${!c.active ? '<span class="mt-3 inline-block rounded-full bg-gray-100 px-3 py-1 text-[10px] font-bold text-gray-500">Inactive</span>' : ""}
        </article>
      `).join("");
    }

    function openCategoryModal(cat) {
      document.getElementById("category-modal-title").textContent = cat ? "Edit category" : "Add category";
      document.getElementById("cf-id").value = cat ? cat.id : "";
      document.getElementById("cf-name").value = cat ? cat.name : "";
      document.getElementById("cf-description").value = cat ? cat.description : "";
      document.getElementById("cf-active").checked = cat ? cat.active : true;
      selectedIcon = cat ? cat.icon : "◈";
      document.getElementById("cf-icon").value = selectedIcon;
      document.getElementById("cf-name-error").classList.add("hidden");
      highlightIcon();
      AdminModal.open("category-modal");
    }

    function highlightIcon() {
      document.querySelectorAll("#cf-icon-picker .icon-pick").forEach(btn => {
        if (btn.dataset.icon === selectedIcon) {
          btn.classList.add("bg-[#f3e7d5]", "border-[#9b6b2c]");
          btn.classList.remove("border-[#eadbc6]");
        } else {
          btn.classList.remove("bg-[#f3e7d5]", "border-[#9b6b2c]");
          btn.classList.add("border-[#eadbc6]");
        }
      });
    }

    function saveCategory(e) {
      e.preventDefault();
      const name = document.getElementById("cf-name").value.trim();
      if (!name) {
        document.getElementById("cf-name-error").classList.remove("hidden");
        return;
      }
      document.getElementById("cf-name-error").classList.add("hidden");

      const id = document.getElementById("cf-id").value;
      const data = {
        name,
        icon: document.getElementById("cf-icon").value,
        description: document.getElementById("cf-description").value.trim(),
        active: document.getElementById("cf-active").checked,
      };

      if (id) {
        const idx = categories.findIndex(c => c.id === parseInt(id));
        if (idx > -1) categories[idx] = { ...categories[idx], ...data };
        AdminToast.show("Category updated");
      } else {
        data.id = nextCatId++;
        data.productCount = 0;
        categories.push(data);
        AdminToast.show("Category added");
      }

      AdminModal.close("category-modal");
      renderCategories();
    }

    function editCategory(id) {
      const c = categories.find(x => x.id === id);
      if (c) openCategoryModal(c);
    }

    function deleteCategory(id) {
      const c = categories.find(x => x.id === id);
      if (!c) return;
      AdminConfirm.show(`Delete category "${c.name}"? Products in this category will become uncategorised.`, () => {
        categories = categories.filter(x => x.id !== id);
        renderCategories();
        AdminToast.show("Category deleted", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        renderCategories();
        // Icon picker event binding
        document.querySelectorAll("#cf-icon-picker .icon-pick").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedIcon = btn.dataset.icon;
            document.getElementById("cf-icon").value = selectedIcon;
            highlightIcon();
          });
        });
      }, 100);
    });
  </script>
</body>
</html>
