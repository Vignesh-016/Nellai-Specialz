<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="categories" data-admin-title="Categories">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Organise products into easy-to-browse collections.</p>
        <button class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white">+ Add category</button>
      </div>

      <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
        <article class="rounded-2xl border border-[#eadbc6] bg-white p-6">
          <div class="flex items-center justify-between"><span class="grid h-12 w-12 place-items-center rounded-xl bg-[#f3e7d5] text-2xl text-[#9b6b2c]">◈</span><button class="text-sm text-[#8e281d]">Edit</button></div>
          <h2 class="mt-5 font-serif text-xl font-bold">Halwa</h2><p class="mt-1 text-sm text-[#7e5a43]">18 products</p>
        </article>
        <article class="rounded-2xl border border-[#eadbc6] bg-white p-6">
          <div class="flex items-center justify-between"><span class="grid h-12 w-12 place-items-center rounded-xl bg-[#f3e7d5] text-2xl text-[#9b6b2c]">✦</span><button class="text-sm text-[#8e281d]">Edit</button></div>
          <h2 class="mt-5 font-serif text-xl font-bold">Combos</h2><p class="mt-1 text-sm text-[#7e5a43]">7 products</p>
        </article>
        <article class="rounded-2xl border border-[#eadbc6] bg-white p-6">
          <div class="flex items-center justify-between"><span class="grid h-12 w-12 place-items-center rounded-xl bg-[#f3e7d5] text-2xl text-[#9b6b2c]">♢</span><button class="text-sm text-[#8e281d]">Edit</button></div>
          <h2 class="mt-5 font-serif text-xl font-bold">Savouries</h2><p class="mt-1 text-sm text-[#7e5a43]">23 products</p>
        </article>
      </div>
    </section>
  </template>

  <script src="assets/admin.js" defer></script>
</body>
</html>
