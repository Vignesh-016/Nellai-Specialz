<!doctype html>
<html lang="en">
  <head><script src="assets/admin-auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Nellai Specialz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-admin-page="blog" data-admin-title="Blog" class="bg-[#f8f1e7] text-[#3a110d]">
  <div data-admin-shell></div>

  <template id="admin-page-content">
    <section class="space-y-6">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="text-sm text-[#7e5a43]">Publish stories about tradition, ingredients, and products.</p>
        <button onclick="openBlogModal()" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ New post</button>
      </div>

      <!-- Filters -->
      <div class="flex gap-3 flex-wrap">
        <select id="blog-status-filter" onchange="renderBlogs()" class="rounded-xl border border-[#eadbc6] bg-white px-4 py-3 text-sm">
          <option value="">All posts</option>
          <option value="published">Published</option>
          <option value="draft">Drafts</option>
        </select>
      </div>

      <!-- Blog Table -->
      <div class="rounded-2xl border border-[#eadbc6] bg-white p-4 sm:p-6">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[800px] text-left text-sm">
            <thead class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]">
              <tr>
                <th class="p-3">Image</th>
                <th class="p-3">Title</th>
                <th class="p-3">Slug</th>
                <th class="p-3">Tags</th>
                <th class="p-3">Status</th>
                <th class="p-3">Publish Date</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="blog-tbody" class="divide-y divide-[#f0e5d8]"></tbody>
          </table>
        </div>
        <div id="blog-empty" class="hidden py-12 text-center text-sm text-[#7e5a43]">No blog posts yet.</div>
      </div>
    </section>

    <!-- BLOG EDITOR MODAL -->
    <div id="blog-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 id="blog-modal-title" class="text-xl font-bold text-[#32110d]">New post</h2>
          <button onclick="AdminModal.close('blog-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <form onsubmit="saveBlog(event)" class="p-6 space-y-5">
          <input type="hidden" id="bf-id" />

          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Blog title <span class="text-red-500">*</span></label>
              <input id="bf-title" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="Enter a compelling title..." />
              <p id="bf-title-error" class="mt-1 text-xs text-red-600 hidden">Blog title is required.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Slug <span class="text-red-500">*</span></label>
              <input id="bf-slug" required class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm font-mono outline-none focus:border-[#9b6b2c]" placeholder="auto-generated-slug" />
              <p id="bf-slug-error" class="mt-1 text-xs text-red-600 hidden">Slug is required.</p>
            </div>
          </div>

          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Short Description</label>
            <textarea id="bf-excerpt" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="Short summary for previews..."></textarea>
          </div>

          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Full Content</label>
            <textarea id="bf-content" rows="8" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-y leading-relaxed" placeholder="Write the full blog content here..."></textarea>
          </div>

          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Tags</label>
            <input id="bf-tags" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="tradition, halwa, ingredients (comma-separated)" />
          </div>

          <!-- Featured Image -->
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Featured Image</label>
            <div class="flex gap-3 items-center">
              <div id="blog-cover-preview" class="hidden h-20 w-28 rounded-xl border border-[#eadbc6] bg-[#f3e7d5] overflow-hidden">
                <img id="blog-cover-img" class="h-full w-full object-cover" />
              </div>
              <div>
                <input type="file" id="blog-cover-input" accept="image/*" class="hidden" onchange="previewBlogCover(this)" />
                <button type="button" onclick="document.getElementById('blog-cover-input').click()" class="rounded-lg bg-[#f3e7d5] px-4 py-2 text-xs font-semibold text-[#8e281d] hover:bg-[#eadbc6] transition">Upload image</button>
                <button type="button" id="blog-cover-remove" onclick="removeBlogCover()" class="hidden ml-2 rounded-lg border border-red-200 px-3 py-2 text-xs font-semibold text-red-500 hover:bg-red-50 transition">Remove</button>
              </div>
            </div>
          </div>

          <!-- Status & Date -->
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Status</label>
              <select id="bf-status" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Publish Date</label>
              <input id="bf-date" type="date" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" />
            </div>
          </div>

          <!-- SEO -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-[#9b6b2c]">SEO</h3>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Meta Title</label>
              <input id="bf-meta-title" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c]" placeholder="SEO title (defaults to blog title)" />
            </div>
            <div>
              <label class="mb-1.5 block text-xs font-semibold text-[#594b45]">Meta Description</label>
              <textarea id="bf-meta-desc" rows="2" class="w-full rounded-xl border border-[#eadbc6] bg-[#fffaf2] px-4 py-3 text-sm outline-none focus:border-[#9b6b2c] resize-none" placeholder="SEO description (defaults to short description)"></textarea>
            </div>
          </div>

          <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-5">
            <button type="button" onclick="AdminModal.close('blog-modal')" class="rounded-xl border border-[#e8e1da] px-4 py-2.5 text-sm font-semibold text-[#594b45] hover:bg-[#f8f6f3] transition">Cancel</button>
            <button type="submit" id="bf-submit-btn" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Save post</button>
          </div>
        </form>
      </div>
    </div>

    <!-- VIEW BLOG MODAL -->
    <div id="blog-view-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#24120f]/50 p-4">
      <div data-modal-box class="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-[#eee8e2] bg-white px-6 py-4 rounded-t-2xl">
          <h2 class="text-xl font-bold text-[#32110d]">Blog preview</h2>
          <button onclick="AdminModal.close('blog-view-modal')" class="grid h-9 w-9 place-items-center rounded-lg border border-[#e8e1da] text-lg text-[#594b45] hover:bg-[#f8f6f3] transition">✕</button>
        </div>
        <div id="blog-view-body" class="p-6 space-y-5"></div>
      </div>
    </div>
  </template>

  <script src="assets/admin.js" defer></script>
  <script>
    let blogs = [
      { id: 1, title: "The story behind Tirunelveli Halwa", slug: "the-story-behind-tirunelveli-halwa", excerpt: "Discover the craft and patience behind every traditional batch.", content: "The making of Tirunelveli Halwa is an art passed down through generations. Each batch is carefully prepared using the finest wheat flour, pure ghee, and the perfect blend of sugar or palm jaggery.", status: "published", date: "2026-09-12", tags: ["tradition", "halwa"], hasCover: true, metaTitle: "", metaDesc: "" },
      { id: 2, title: "5 ways to serve halwa", slug: "5-ways-to-serve-halwa", excerpt: "Simple serving ideas for celebrations and everyday moments.", content: "Halwa isn't just a dessert — it's an experience. Here are five creative ways to serve halwa at your next gathering.", status: "draft", date: "", tags: ["recipes", "tips"], hasCover: false, metaTitle: "", metaDesc: "" },
      { id: 3, title: "From palm jaggery to perfect texture", slug: "from-palm-jaggery-to-perfect-texture", excerpt: "How carefully selected ingredients shape authentic flavour.", content: "Every batch of our Karupatti Halwa starts with hand-selected palm jaggery from local farmers. The quality of this key ingredient determines the final taste and colour.", status: "published", date: "2026-08-26", tags: ["ingredients", "karupatti"], hasCover: true, metaTitle: "Palm Jaggery Halwa — The Secret Ingredient", metaDesc: "Learn how carefully selected palm jaggery creates the authentic flavour of Tirunelveli Karupatti Halwa." },
    ];
    let nextBlogId = 4;

    function renderBlogs() {
      const filter = document.getElementById("blog-status-filter")?.value || "";
      const filtered = filter ? blogs.filter(b => b.status === filter) : blogs;
      const tbody = document.getElementById("blog-tbody");
      const empty = document.getElementById("blog-empty");

      if (!filtered.length) { tbody.innerHTML = ""; empty.classList.remove("hidden"); return; }
      empty.classList.add("hidden");

      tbody.innerHTML = filtered.map(b => {
        const statusColor = b.status === "published" ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700";
        const statusLabel = b.status === "published" ? "Published" : "Draft";
        const displayDate = b.date ? new Date(b.date).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";

        return `
          <tr class="hover:bg-[#fffcf7] transition">
            <td class="p-3">
              <div class="grid h-10 w-14 place-items-center rounded-lg bg-[#f3e7d5] text-lg text-[#9b6b2c]">${b.hasCover ? "🖼" : "—"}</div>
            </td>
            <td class="p-3">
              <p class="font-semibold text-[#32110d]">${b.title}</p>
              <p class="text-xs text-[#a89387] truncate max-w-[250px]">${b.excerpt}</p>
            </td>
            <td class="p-3 font-mono text-xs text-[#7e5a43]">/${b.slug}</td>
            <td class="p-3">
              <div class="flex flex-wrap gap-1">
                ${b.tags.length ? b.tags.map(t => `<span class="rounded-full bg-[#f3e7d5] px-2 py-0.5 text-[10px] font-semibold text-[#9b6b2c]">${t}</span>`).join("") : '<span class="text-xs text-[#c4b5a5]">—</span>'}
              </div>
            </td>
            <td class="p-3"><span class="rounded-full ${statusColor} px-3 py-1 text-xs font-semibold">${statusLabel}</span></td>
            <td class="p-3 text-xs text-[#7e5a43]">${displayDate}</td>
            <td class="p-3">
              <div class="flex justify-end gap-2">
                <button onclick="viewBlog(${b.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#594b45] hover:bg-[#f5eee8] transition" title="View">👁</button>
                <button onclick="editBlog(${b.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-[#e8e1da] text-xs text-[#8e281d] hover:bg-[#f5eee8] transition" title="Edit">✎</button>
                <button onclick="deleteBlog(${b.id})" class="grid h-8 w-8 place-items-center rounded-lg border border-red-200 text-xs text-red-500 hover:bg-red-50 transition" title="Delete">🗑</button>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    /* ═══ Image handling ═══ */
    function previewBlogCover(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById("blog-cover-img").src = e.target.result;
          document.getElementById("blog-cover-preview").classList.remove("hidden");
          document.getElementById("blog-cover-remove").classList.remove("hidden");
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removeBlogCover() {
      document.getElementById("blog-cover-preview").classList.add("hidden");
      document.getElementById("blog-cover-remove").classList.add("hidden");
      document.getElementById("blog-cover-input").value = "";
    }

    function openBlogModal(blog) {
      document.getElementById("blog-modal-title").textContent = blog ? "Edit post" : "New post";
      document.getElementById("bf-submit-btn").textContent = blog ? "Update post" : "Save post";
      document.getElementById("bf-id").value = blog ? blog.id : "";
      document.getElementById("bf-title").value = blog ? blog.title : "";
      document.getElementById("bf-slug").value = blog ? blog.slug : "";
      document.getElementById("bf-excerpt").value = blog ? blog.excerpt : "";
      document.getElementById("bf-content").value = blog ? blog.content : "";
      document.getElementById("bf-tags").value = blog ? blog.tags.join(", ") : "";
      document.getElementById("bf-status").value = blog ? blog.status : "published";
      document.getElementById("bf-date").value = blog ? blog.date : "";
      document.getElementById("bf-meta-title").value = blog ? blog.metaTitle : "";
      document.getElementById("bf-meta-desc").value = blog ? blog.metaDesc : "";
      document.getElementById("bf-title-error").classList.add("hidden");
      document.getElementById("bf-slug-error").classList.add("hidden");

      const preview = document.getElementById("blog-cover-preview");
      const removeBtn = document.getElementById("blog-cover-remove");
      if (blog && blog.hasCover) {
        preview.classList.remove("hidden");
        removeBtn.classList.remove("hidden");
        document.getElementById("blog-cover-img").src = "";
      } else {
        preview.classList.add("hidden");
        removeBtn.classList.add("hidden");
      }
      document.getElementById("blog-cover-input").value = "";

      AdminSlug.reset("bf-slug");
      AdminSlug.bind("bf-title", "bf-slug");
      AdminModal.open("blog-modal");
    }

    function saveBlog(e) {
      e.preventDefault();
      const title = document.getElementById("bf-title").value.trim();
      const slug = document.getElementById("bf-slug").value.trim();
      let valid = true;
      if (!title) { document.getElementById("bf-title-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("bf-title-error").classList.add("hidden"); }
      if (!slug) { document.getElementById("bf-slug-error").classList.remove("hidden"); valid = false; }
      else { document.getElementById("bf-slug-error").classList.add("hidden"); }
      if (!valid) return;

      const tags = document.getElementById("bf-tags").value.split(",").map(t => t.trim()).filter(Boolean);
      const hasCover = !document.getElementById("blog-cover-preview").classList.contains("hidden");

      const id = document.getElementById("bf-id").value;
      const data = {
        title, slug,
        excerpt: document.getElementById("bf-excerpt").value.trim(),
        content: document.getElementById("bf-content").value.trim(),
        status: document.getElementById("bf-status").value,
        date: document.getElementById("bf-date").value,
        tags, hasCover,
        metaTitle: document.getElementById("bf-meta-title").value.trim(),
        metaDesc: document.getElementById("bf-meta-desc").value.trim(),
      };

      if (id) {
        const idx = blogs.findIndex(b => b.id === parseInt(id));
        if (idx > -1) blogs[idx] = { ...blogs[idx], ...data };
        AdminToast.show("Post updated");
      } else {
        data.id = nextBlogId++;
        if (!data.date) data.date = new Date().toISOString().split('T')[0];
        blogs.push(data);
        AdminToast.show("Post created");
      }

      AdminModal.close("blog-modal");
      renderBlogs();
    }

    function viewBlog(id) {
      const b = blogs.find(x => x.id === id);
      if (!b) return;
      const displayDate = b.date ? new Date(b.date).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "Not set";

      document.getElementById("blog-view-body").innerHTML = `
        ${b.hasCover ? '<div class="h-40 rounded-xl bg-[#f3e7d5] flex items-center justify-center text-4xl text-[#9b6b2c]">🖼</div>' : ""}
        <div class="flex items-center gap-2 flex-wrap">
          <span class="rounded-full ${b.status === 'published' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'} px-3 py-1 text-xs font-semibold">${b.status === 'published' ? 'Published' : 'Draft'}</span>
          <span class="text-xs text-[#9b6b2c]">${displayDate}</span>
        </div>
        <h3 class="text-2xl font-bold text-[#32110d]">${b.title}</h3>
        <p class="text-xs font-mono text-[#7e5a43]">/${b.slug}</p>
        ${b.excerpt ? `<p class="text-sm italic text-[#7e5a43] border-l-4 border-[#eadbc6] pl-4">${b.excerpt}</p>` : ""}
        <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4">
          <p class="text-sm text-[#594b45] leading-relaxed whitespace-pre-line">${b.content || "No content yet."}</p>
        </div>
        ${b.tags.length ? `<div class="flex flex-wrap gap-2">${b.tags.map(t => `<span class="rounded-full bg-[#f3e7d5] px-3 py-1 text-xs font-semibold text-[#9b6b2c]">${t}</span>`).join("")}</div>` : ""}
        ${b.metaTitle || b.metaDesc ? `
        <div class="rounded-xl bg-[#fffcf7] border border-[#eadbc6] p-4 space-y-2">
          <p class="text-xs font-bold uppercase tracking-wider text-[#9b6b2c]">SEO</p>
          ${b.metaTitle ? `<p class="text-sm"><span class="text-[#7e5a43]">Meta Title:</span> ${b.metaTitle}</p>` : ""}
          ${b.metaDesc ? `<p class="text-sm"><span class="text-[#7e5a43]">Meta Desc:</span> ${b.metaDesc}</p>` : ""}
        </div>` : ""}
        <div class="flex gap-3 justify-end border-t border-[#eee8e2] pt-4">
          <button onclick="AdminModal.close('blog-view-modal');editBlog(${b.id})" class="rounded-xl bg-[#54170f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#6e1f15] transition">Edit post</button>
        </div>`;
      AdminModal.open("blog-view-modal");
    }

    function editBlog(id) {
      const b = blogs.find(x => x.id === id);
      if (b) openBlogModal(b);
    }

    function deleteBlog(id) {
      const b = blogs.find(x => x.id === id);
      if (!b) return;
      AdminConfirm.show(`Are you sure you want to delete this item? Blog post "${b.title}" will be permanently removed.`, () => {
        blogs = blogs.filter(x => x.id !== id);
        renderBlogs();
        AdminToast.show("Post deleted", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(renderBlogs, 100);
    });
  </script>
</body>
</html>
