<!doctype html>
<html lang="en">
  <head><script src="assets/admin-auth.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Nellai Specialz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    data-admin-page="dashboard"
    data-admin-title="Dashboard"
    class="bg-[#f8f1e7] text-[#3a110d]"
  >
    <div data-admin-shell></div>
    <template id="admin-page-content">
      <section class="space-y-6">
        <div>
          <p class="text-sm text-[#7e5a43]">
            Welcome back. Here is today's store overview.
          </p>
        </div>

        <!-- ═══ Summary Cards ═══ -->
        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Total Products</p>
            <p id="stat-products" class="mt-3 text-3xl font-bold">0</p>
            <p class="mt-2 text-xs text-emerald-700">↑ 8% this month</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Active Products</p>
            <p id="stat-active-products" class="mt-3 text-3xl font-bold text-emerald-700">0</p>
            <p class="mt-2 text-xs text-[#9b6b2c]">6 drafts</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Categories</p>
            <p id="stat-categories" class="mt-3 text-3xl font-bold">0</p>
            <p class="mt-2 text-xs text-[#9b6b2c]">6 sub categories</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Low Stock Products</p>
            <p id="stat-low-stock" class="mt-3 text-3xl font-bold text-amber-600">0</p>
            <p class="mt-2 text-xs text-amber-600">Needs restocking</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Orders</p>
            <p id="stat-orders" class="mt-3 text-3xl font-bold">0</p>
            <p class="mt-2 text-xs text-emerald-700">↑ 12% this month</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Pending Orders</p>
            <p id="stat-pending" class="mt-3 text-3xl font-bold text-amber-600">0</p>
            <p class="mt-2 text-xs text-amber-600">Awaiting processing</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">Active Coupons</p>
            <p id="stat-coupons" class="mt-3 text-3xl font-bold">0</p>
            <p class="mt-2 text-xs text-emerald-700">All running normally</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5 hover:shadow-lg hover:shadow-[#eadbc6]/30 transition-all duration-200">
            <p class="text-sm text-[#7e5a43]">New Enquiries</p>
            <p id="stat-enquiries" class="mt-3 text-3xl font-bold">0</p>
            <p class="mt-2 text-xs text-[#9b6b2c]">Awaiting reply</p>
          </div>
        </div>

        <!-- ═══ Quick Actions ═══ -->
        <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
          <h2 class="font-serif text-xl font-bold mb-4">Quick actions</h2>
          <div class="flex flex-wrap gap-3">
            <a href="products.html" class="rounded-xl bg-[#54170f] px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-[#54170f]/20 hover:bg-[#6e1f15] transition">+ Add Product</a>
            <a href="categories.html" class="rounded-xl bg-[#f3e7d5] px-5 py-3 text-sm font-semibold text-[#54170f] hover:bg-[#eadbc6] transition">+ Add Category</a>
            <a href="orders.html" class="rounded-xl bg-[#f3e7d5] px-5 py-3 text-sm font-semibold text-[#54170f] hover:bg-[#eadbc6] transition">View Orders</a>
            <a href="coupons.html" class="rounded-xl bg-[#f3e7d5] px-5 py-3 text-sm font-semibold text-[#54170f] hover:bg-[#eadbc6] transition">+ Add Coupon</a>
            <a href="blog.html" class="rounded-xl bg-[#f3e7d5] px-5 py-3 text-sm font-semibold text-[#54170f] hover:bg-[#eadbc6] transition">+ Add Blog</a>
          </div>
        </div>

        <!-- ═══ Recent Orders + Low Stock ═══ -->
        <div class="grid gap-6 xl:grid-cols-[1.4fr_1fr]">
          <!-- Recent Orders -->
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
            <div class="mb-5 flex items-center justify-between">
              <h2 class="font-serif text-xl font-bold">Recent orders</h2>
              <a href="orders.html" class="text-sm font-semibold text-[#8e281d]">View all →</a>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]">
                  <tr>
                    <th class="pb-3">Order</th>
                    <th class="pb-3">Customer</th>
                    <th class="pb-3">Amount</th>
                    <th class="pb-3">Date</th>
                    <th class="pb-3">Status</th>
                  </tr>
                </thead>
                <tbody id="recent-orders-body" hidden class="divide-y divide-[#f0e5d8]"></tbody>
              </table>
            </div>
          </div>

          <!-- Low Stock Products -->
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
            <div class="mb-5 flex items-center justify-between">
              <h2 class="font-serif text-xl font-bold">Low stock products</h2>
              <a href="products.html" class="text-sm font-semibold text-[#8e281d]">View all →</a>
            </div>
            <div id="low-stock-body" class="space-y-3"></div>
            <div class="space-y-3 hidden">
              <div class="flex items-center justify-between rounded-xl border border-amber-200 bg-amber-50/50 p-4">
                <div>
                  <p class="font-semibold text-[#32110d]">Traditional Halwa Combo</p>
                  <p class="text-xs text-[#7e5a43]">Combo Box</p>
                </div>
                <div class="text-right">
                  <p class="text-lg font-bold text-red-600">0</p>
                  <span class="rounded-full bg-red-50 px-2 py-0.5 text-[10px] font-bold text-red-700">Out of stock</span>
                </div>
              </div>
              <div class="flex items-center justify-between rounded-xl border border-amber-200 bg-amber-50/50 p-4">
                <div>
                  <p class="font-semibold text-[#32110d]">Cashew Halwa</p>
                  <p class="text-xs text-[#7e5a43]">500g variant</p>
                </div>
                <div class="text-right">
                  <p class="text-lg font-bold text-red-600">0</p>
                  <span class="rounded-full bg-red-50 px-2 py-0.5 text-[10px] font-bold text-red-700">Out of stock</span>
                </div>
              </div>
              <div class="flex items-center justify-between rounded-xl border border-amber-200 bg-amber-50/50 p-4">
                <div>
                  <p class="font-semibold text-[#32110d]">Cashew Halwa</p>
                  <p class="text-xs text-[#7e5a43]">1kg variant</p>
                </div>
                <div class="text-right">
                  <p class="text-lg font-bold text-amber-600">5</p>
                  <span class="rounded-full bg-amber-50 px-2 py-0.5 text-[10px] font-bold text-amber-700">Low stock</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ Recent Enquiries ═══ -->
        <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
          <div class="mb-5 flex items-center justify-between">
            <h2 class="font-serif text-xl font-bold">Recent enquiries</h2>
            <a href="enquiries.html" class="text-sm font-semibold text-[#8e281d]">View all →</a>
          </div>
          <div id="recent-enquiries-body" class="space-y-1">
            <div class="flex flex-col gap-2 border-b border-[#f0e5d8] py-4 sm:flex-row sm:items-center sm:justify-between">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 flex-wrap">
                  <h3 class="font-semibold text-[#32110d]">Priya S.</h3>
                  <span class="rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">New</span>
                </div>
                <p class="mt-1 text-sm text-[#7e5a43] truncate">Bulk order enquiry for a wedding function</p>
              </div>
              <span class="text-xs text-[#9b6b2c] shrink-0">Today, 10:24 AM</span>
            </div>
            <div class="flex flex-col gap-2 py-4 sm:flex-row sm:items-center sm:justify-between">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 flex-wrap">
                  <h3 class="font-semibold text-[#32110d]">Suresh V.</h3>
                  <span class="rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">New</span>
                </div>
                <p class="mt-1 text-sm text-[#7e5a43] truncate">Corporate Diwali gifts</p>
              </div>
              <span class="text-xs text-[#9b6b2c] shrink-0">Today, 9:15 AM</span>
            </div>
          </div>
        </div>
      </section>
    </template>
    <script src="assets/admin.js" defer></script>
    <script src="assets/dashboard/dashboard.js" defer></script>
  </body>
</html>
