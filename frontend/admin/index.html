<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Nellai Specialz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    data-admin-page="dashboard"
    data-admin-title="Dashboard"
    class="bg-[#f8f1e7] text-[#3a110d]"
  >
    <div data-admin-shell></div>
    <template id="admin-page-content">
      <section class="space-y-6">
        <div>
          <p class="text-sm text-[#7e5a43]">
            Welcome back. Here is today’s store overview.
          </p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5">
            <p class="text-sm text-[#7e5a43]">Total products</p>
            <p class="mt-3 text-3xl font-bold">48</p>
            <p class="mt-2 text-xs text-emerald-700">↑ 8% this month</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5">
            <p class="text-sm text-[#7e5a43]">Orders this month</p>
            <p class="mt-3 text-3xl font-bold">326</p>
            <p class="mt-2 text-xs text-emerald-700">↑ 12% this month</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5">
            <p class="text-sm text-[#7e5a43]">Enquiries</p>
            <p class="mt-3 text-3xl font-bold">18</p>
            <p class="mt-2 text-xs text-[#9b6b2c]">6 awaiting reply</p>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-5">
            <p class="text-sm text-[#7e5a43]">Active offers</p>
            <p class="mt-3 text-3xl font-bold">7</p>
            <p class="mt-2 text-xs text-emerald-700">All running normally</p>
          </div>
        </div>
        <div class="grid gap-6 xl:grid-cols-[1.4fr_1fr]">
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
            <div class="mb-5 flex items-center justify-between">
              <h2 class="font-serif text-xl font-bold">Recent orders</h2>
              <a
                href="products.html"
                class="text-sm font-semibold text-[#8e281d]"
                >View products →</a
              >
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead
                  class="border-b border-[#eadbc6] text-xs uppercase tracking-wider text-[#9b6b2c]"
                >
                  <tr>
                    <th class="pb-3">Order</th>
                    <th class="pb-3">Customer</th>
                    <th class="pb-3">Amount</th>
                    <th class="pb-3">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#f0e5d8]">
                  <tr>
                    <td class="py-4 font-semibold">#NS-1048</td>
                    <td class="py-4">Arun Kumar</td>
                    <td class="py-4">₹1,150</td>
                    <td class="py-4">
                      <span
                        class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700"
                        >Delivered</span
                      >
                    </td>
                  </tr>
                  <tr>
                    <td class="py-4 font-semibold">#NS-1047</td>
                    <td class="py-4">Meena Raj</td>
                    <td class="py-4">₹600</td>
                    <td class="py-4">
                      <span
                        class="rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700"
                        >Processing</span
                      >
                    </td>
                  </tr>
                  <tr>
                    <td class="py-4 font-semibold">#NS-1046</td>
                    <td class="py-4">Suresh B</td>
                    <td class="py-4">₹2,300</td>
                    <td class="py-4">
                      <span
                        class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700"
                        >Shipped</span
                      >
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="rounded-2xl border border-[#eadbc6] bg-white p-6">
            <h2 class="font-serif text-xl font-bold">Top products</h2>
            <div class="mt-5 space-y-4">
              <div class="flex items-center justify-between">
                <span>Karupatti Halwa</span
                ><span class="font-semibold">₹48,200</span>
              </div>
              <div class="h-2 rounded-full bg-[#f3e7d5]">
                <div class="h-2 w-4/5 rounded-full bg-[#9b6b2c]"></div>
              </div>
              <div class="flex items-center justify-between">
                <span>Cashew Halwa</span
                ><span class="font-semibold">₹32,750</span>
              </div>
              <div class="h-2 rounded-full bg-[#f3e7d5]">
                <div class="h-2 w-3/5 rounded-full bg-[#9b6b2c]"></div>
              </div>
              <div class="flex items-center justify-between">
                <span>Halwa Combo</span
                ><span class="font-semibold">₹26,400</span>
              </div>
              <div class="h-2 rounded-full bg-[#f3e7d5]">
                <div class="h-2 w-1/2 rounded-full bg-[#9b6b2c]"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </template>
    <script src="assets/admin.js" defer></script>
  </body>
</html>
