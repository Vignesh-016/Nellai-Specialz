<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Nellai Specialz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/checkout.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth/session.js"></script>
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-[#FBF5E9] text-[#32110D] font-sans antialiased selection:bg-[#8C1C13] selection:text-white"
  >
    <div id="site-header"></div>
    <main class="grid min-h-screen lg:grid-cols-2 bg-[#FBF5E9]">
      <section class="relative hidden overflow-hidden bg-[#321307] lg:block">
        <img
          src="assets/images/heritage/story-hero.jpg"
          alt="Tirunelveli heritage"
          class="absolute inset-0 h-full w-full object-cover opacity-60"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-[#321307] via-[#321307]/70 to-[#321307]/40"></div>
        <div class="relative flex h-full items-end p-12 xl:p-20">
          <div class="max-w-md text-[#FFF8EF]">
            <span
              class="inline-block rounded-full border border-[#D9B86C]/40 bg-[#D9B86C]/10 px-3.5 py-1 text-xs font-bold uppercase tracking-[0.2em] text-[#E7BD6D]"
            >
              Welcome back
            </span>
            <h1 class="mt-4 font-serif text-4xl font-bold leading-tight text-white xl:text-5xl">
              The taste of home, <br /><span class="text-[#E7BD6D]">waiting for you.</span>
            </h1>
            <p class="mt-4 text-sm leading-relaxed text-[#FFF8EF]/80">
              Sign in to continue your journey through authentic Tirunelveli
              flavours and handcrafted delicacies.
            </p>
          </div>
        </div>
      </section>
      <section class="flex items-center justify-center bg-[#FFF8EF] px-5 py-12 sm:px-8">
        <div
          class="w-full max-w-md rounded-2xl border border-[#EADBC1] bg-white p-6 shadow-xl shadow-[#321307]/5 sm:p-10"
        >
          <a href="index.html" class="inline-block"
            ><img
              src="assets/images/nellai-specialz-logo.png"
              alt="Nellai Specialz"
              class="h-12 w-auto object-contain"
          /></a>
          <p
            class="mt-8 text-xs font-bold uppercase tracking-[0.22em] text-[#8C1C13]"
          >
            Account Access
          </p>
          <h2 class="mt-2 font-serif text-3xl font-bold text-[#321307] sm:text-4xl">
            Sign in
          </h2>
          <p class="mt-2 text-sm text-[#806B58]">
            Access your orders, saved addresses, and quick checkout.
          </p>
          <form id="customerLoginForm" class="mt-8 space-y-5">
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-[#321307]"
                >Email or phone</label
              ><input
                id="email"
                type="text"
                required
                placeholder="Enter email or phone"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              />
            </div>
            <div>
              <label for="password" class="mb-2 block text-sm font-semibold text-[#321307]"
                >Password</label
              ><input
                id="password"
                type="password"
                required
                placeholder="Enter password"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              /><button
                type="button"
                data-forgot-password
                class="mt-2 block text-right text-xs font-semibold text-[#8C1C13] transition hover:text-[#7A120A] cursor-pointer"
              >
                Forgot Password?
              </button>
            </div>
            <button
              type="submit"
              class="h-12 w-full rounded-full bg-[#8C1C13] font-bold text-[#FFF8EF] shadow-md shadow-[#8C1C13]/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#7A120A] cursor-pointer"
            >
              Sign In
            </button>
          </form>
          <p class="mt-6 text-center text-sm text-[#806B58]">
            New here?
            <a
              href="register.html"
              class="font-semibold text-[#8C1C13] underline decoration-[#D9B86C] underline-offset-4 transition hover:text-[#7A120A]"
              >Create an account</a
            >
          </p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/login.js"></script>
  </body>
</html>
