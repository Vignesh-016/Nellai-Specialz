<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Nellai Specialz</title>
    <link rel="stylesheet" href="assets/css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-[#F8F3E8] text-[#2A1B16]">
    <div id="site-header"></div>
    <main class="grid min-h-screen lg:grid-cols-2">
      <section class="relative hidden overflow-hidden bg-[#321307] lg:block">
        <img
          src="assets/images/heritage/story-hero.jpg"
          alt="Tirunelveli heritage"
          class="absolute inset-0 h-full w-full object-cover opacity-70"
        />
        <div class="absolute inset-0 bg-[#321307]/55"></div>
        <div class="relative flex h-full items-end p-12 xl:p-20">
          <div class="max-w-md text-[#fff3d6]">
            <p
              class="text-xs font-bold uppercase tracking-[0.28em] text-[#D9B86C]"
            >
              Welcome back
            </p>
            <h1 class="mt-4 font-serif text-5xl leading-none">
              The taste of home, waiting for you.
            </h1>
            <p class="mt-5 text-sm leading-7 text-[#f6dfbd]">
              Sign in to continue your journey through authentic Tirunelveli
              flavours.
            </p>
          </div>
        </div>
      </section>
      <section class="flex items-center justify-center px-5 py-12 sm:px-8">
        <div
          class="w-full max-w-md rounded-2xl border border-[#E7DDD1] bg-white p-6 shadow-[0_20px_50px_rgba(74,22,15,0.08)] sm:p-10"
        >
          <a href="index.html" class="inline-block"
            ><img
              src="assets/images/nellai-specialz-logo.png"
              alt="Nellai Specialz"
              class="h-12 w-auto object-contain"
          /></a>
          <p
            class="mt-10 text-xs font-bold uppercase tracking-[0.22em] text-[#B88932]"
          >
            Account
          </p>
          <h2 class="mt-2 font-serif text-4xl font-semibold text-[#321307]">
            Sign in
          </h2>
          <p class="mt-3 text-sm text-[#74685F]">
            Access your orders and saved details.
          </p>
          <form class="mt-8 space-y-5" onsubmit="event.preventDefault()">
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold"
                >Email or phone</label
              ><input
                id="email"
                type="text"
                required
                class="h-12 w-full rounded-lg border border-[#E7DDD1] bg-[#FFFCF7] px-4 outline-none focus:border-[#B88932] focus:ring-2 focus:ring-[#B88932]/20"
              />
            </div>
            <div>
              <label for="password" class="mb-2 block text-sm font-semibold"
                >Password</label
              ><input
                id="password"
                type="password"
                required
                class="h-12 w-full rounded-lg border border-[#E7DDD1] bg-[#FFFCF7] px-4 outline-none focus:border-[#B88932] focus:ring-2 focus:ring-[#B88932]/20"
              /><button
                type="button"
                data-forgot-password
                class="mt-2 block text-right text-xs font-semibold text-[#5A160F]"
              >
                Forgot Password?
              </button>
            </div>
            <button
              type="submit"
              class="h-12 w-full rounded-lg bg-[#5A160F] font-semibold text-[#FFF8EB] transition hover:bg-[#321307]"
            >
              Sign In
            </button>
          </form>
          <p class="mt-6 text-center text-sm text-[#74685F]">
            New here?
            <a
              href="register.html"
              class="font-semibold text-[#5A160F] underline decoration-[#B88932] underline-offset-4"
              >Create an account</a
            >
          </p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
  <script src="assets/js/login.js"></script>
  </body>
</html>
