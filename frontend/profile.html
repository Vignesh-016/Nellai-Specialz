<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile | Nellai Specialz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/checkout.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth/session.js"></script>
  </head>
  <body
    class="overflow-x-hidden bg-[#FBF5E9] text-[#32110D] antialiased selection:bg-[#8C1C13] selection:text-white"
  >
    <div id="site-header"></div>
    <main class="mx-auto w-full max-w-[1280px] px-4 py-10 sm:px-6 lg:px-8 bg-[#FBF5E9]">
      <div class="mb-8">
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#8C1C13]">
          Account Center
        </p>
        <h1 class="mt-2 font-serif text-3xl font-bold text-[#321307] sm:text-4xl">
          My Profile
        </h1>
      </div>
      <div class="grid gap-6 lg:grid-cols-[260px_1fr]">
        <nav
          class="h-fit rounded-2xl border border-[#EADBC1] bg-white p-3 shadow-md shadow-[#321307]/5"
          aria-label="Account navigation"
        >
          <a
            href="#profile"
            class="block rounded-xl bg-[#8C1C13] px-4 py-3 text-sm font-bold text-[#FFF8EF] shadow-sm"
            data-view="profile">My Profile</a
          ><a
            href="#orders"
            class="mt-1 block rounded-xl px-4 py-3 text-sm font-medium text-[#806B58] transition hover:bg-[#FFF8EF] hover:text-[#321307]"
            data-view="orders">My Orders</a
          ><a
            href="#addresses"
            class="mt-1 block rounded-xl px-4 py-3 text-sm font-medium text-[#806B58] transition hover:bg-[#FFF8EF] hover:text-[#321307]"
            data-view="addresses">Addresses</a
          ><a
            href="#logout" data-view="logout"
            class="mt-1 block rounded-xl px-4 py-3 text-sm font-semibold text-[#8C1C13] transition hover:bg-[#FFF8EF]"
            >Logout</a
          >
        </nav>
        <section
          id="profile"
          class="rounded-2xl border border-[#EADBC1] bg-white p-6 shadow-md shadow-[#321307]/5 sm:p-8"
        >
          <h2 class="font-serif text-2xl font-bold text-[#321307]">
            Personal Details
          </h2>
          <p class="mt-2 text-sm text-[#806B58]">
            Keep your contact details up to date.
          </p>
          <form
            class="mt-8 grid gap-5 sm:grid-cols-2"
            onsubmit="event.preventDefault()"
          >
            <div>
              <label
                for="profile-first"
                class="mb-2 block text-sm font-semibold text-[#321307]"
                >First name</label
              ><input
                id="profile-first"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              />
            </div>
            <div>
              <label for="profile-last" class="mb-2 block text-sm font-semibold text-[#321307]"
                >Last name</label
              ><input
                id="profile-last"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              />
            </div>
            <div>
              <label
                for="profile-email"
                class="mb-2 block text-sm font-semibold text-[#321307]"
                >Email</label
              ><input
                id="profile-email"
                type="email"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              />
            </div>
            <div>
              <label
                for="profile-phone"
                class="mb-2 block text-sm font-semibold text-[#321307]"
                >Phone</label
              ><input
                id="profile-phone"
                type="tel"
                class="h-12 w-full rounded-lg border border-[#EADBC1] bg-[#FFFBF5] px-4 text-[#321307] outline-none transition focus:border-[#8C1C13] focus:ring-2 focus:ring-[#8C1C13]/20"
              />
            </div>
            <button
              class="h-12 rounded-full bg-[#8C1C13] px-8 font-bold text-[#FFF8EF] shadow-md shadow-[#8C1C13]/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#7A120A] sm:col-span-2 sm:w-fit cursor-pointer"
            >
              Save changes
            </button>
          </form>
        </section>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="assets/js/profile.js"></script>
  </body>
</html>
